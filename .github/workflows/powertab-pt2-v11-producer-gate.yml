name: PowerTab v11 producer evidence gate

on:
  workflow_dispatch:
  push:
    branches:
      - work/powertab-pt2-v11-editor-evidence-gate
    paths:
      - .github/powertab-editor-evidence-trigger

concurrency:
  group: powertab-v11-producer-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  producer-evidence:
    name: Execute exact Power Tab Editor producer
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    env:
      EVIDENCE_DIR: ${{ github.workspace }}/powertab-producer-evidence
      FIXTURE_PATH: ${{ github.workspace }}/fixtures/powertab-v11/powertab-v11-original-six-position.pt2
      EDITOR_FILE: ${{ github.workspace }}/powertab-producer-evidence/powertab-v11-editor-resaved-six-position.pt2
      SOURCE_BASE: 6c17997eba96e16aa248d8fd5a0e632ba5f370ce
      ACCEPTED_APPLICATION_SOURCE: 2a8e5951ec4ced3ce63b2df85d82e54c0ba79ea0
      FORK_MAIN_AUTHORITY: 60c2e5de0887b1bcdd426d932632946edd07d3c3
      INSTALLER_SHA256: 523f12b26b457afa1ea8b15cf0daa2dfd1d82106da723150f662d8bee6a48037
      FIXTURE_SHA256: 669f9b71e7f8ba3c9ce939b98076bbddc17fb977b63b7f647f4bd01cfa072e71

    steps:
      - name: Check out exact triggering source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare evidence directory
        shell: bash
        run: |
          mkdir -p "$EVIDENCE_DIR"
          printf '%s\n' "$GITHUB_SHA" > "$EVIDENCE_DIR/triggering-commit.txt"
          env | sort > "$EVIDENCE_DIR/runner-environment.txt"
          uname -a > "$EVIDENCE_DIR/uname.txt"

      - name: Confirm exact authority and temporary boundary
        id: authority
        shell: bash
        run: |
          set +e
          python3 - <<'PY' > "$EVIDENCE_DIR/authority.log" 2>&1
          import hashlib
          import os
          import pathlib
          import subprocess
          import sys

          expected_branch = "work/powertab-pt2-v11-editor-evidence-gate"
          actual_branch = os.environ.get("GITHUB_REF_NAME")
          assert actual_branch == expected_branch, (
              f"branch mismatch: expected {expected_branch!r}, actual {actual_branch!r}"
          )

          def git(*args):
              return subprocess.check_output(["git", *args], text=True).strip()

          source_base = os.environ["SOURCE_BASE"]
          accepted = os.environ["ACCEPTED_APPLICATION_SOURCE"]
          subprocess.run(
              ["git", "merge-base", "--is-ancestor", accepted, "HEAD"],
              check=True,
          )
          subprocess.run(
              ["git", "merge-base", "--is-ancestor", source_base, "HEAD"],
              check=True,
          )

          expected_files = {
              ".github/powertab-editor-evidence-trigger",
              ".github/workflows/powertab-pt2-v11-producer-gate.yml",
              "docs/known-problems-register-addendum-powertab-source-evidence.md",
              "docs/powertab-pt2-v11-editor-evidence-gate-result-2026-08-05.md",
              "docs/powertab-pt2-v11-hosted-producer-execution-preflight-2026-08-05.md",
          }
          actual_files = set(
              filter(None, git("diff", "--name-only", f"{source_base}..HEAD").splitlines())
          )
          assert actual_files == expected_files, (
              "changed-file boundary mismatch\n"
              f"expected: {sorted(expected_files)}\n"
              f"actual:   {sorted(actual_files)}"
          )

          fixture = pathlib.Path(os.environ["FIXTURE_PATH"])
          assert fixture.is_file(), f"missing fixture: {fixture}"
          fixture_hash = hashlib.sha256(fixture.read_bytes()).hexdigest()
          assert fixture_hash == os.environ["FIXTURE_SHA256"], (
              "fixture hash mismatch: "
              f"expected {os.environ['FIXTURE_SHA256']}, actual {fixture_hash}"
          )

          trigger = pathlib.Path(".github/powertab-editor-evidence-trigger")
          expected_trigger = "PowerTab v11 producer gate: intentional single run on 2026-08-05.\n"
          actual_trigger = trigger.read_text(encoding="utf-8")
          assert actual_trigger == expected_trigger, (
              f"trigger content mismatch: expected {expected_trigger!r}, actual {actual_trigger!r}"
          )

          remote_main = git("ls-remote", "origin", "refs/heads/main").split()[0]
          assert remote_main == os.environ["FORK_MAIN_AUTHORITY"], (
              "fork main mismatch: "
              f"expected {os.environ['FORK_MAIN_AUTHORITY']}, actual {remote_main}"
          )

          print(f"branch: {actual_branch}")
          print(f"head: {git('rev-parse', 'HEAD')}")
          print(f"source base: {source_base}")
          print(f"accepted application ancestor: {accepted}")
          print(f"fork main: {remote_main}")
          print(f"fixture SHA-256: {fixture_hash}")
          print("changed files:")
          for path in sorted(actual_files):
              print(f"- {path}")
          PY
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Install bounded producer runtime
        id: runtime
        if: steps.authority.outputs.exit_code == '0'
        shell: bash
        run: |
          set +e
          {
            sudo apt-get update
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
              imagemagick \
              innoextract \
              wine64 \
              x11-utils \
              xauth \
              xdotool \
              xvfb
          } > "$EVIDENCE_DIR/runtime-install.log" 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" = "0" ]; then
            {
              command -v wine || true
              command -v wine64 || true
              command -v wineboot || true
              command -v wineserver || true
              command -v innoextract || true
              command -v xvfb-run || true
              command -v xdotool || true
              dpkg-query -W -f='${Package} ${Version}\n' wine64 innoextract xvfb xdotool imagemagick 2>/dev/null || true
            } > "$EVIDENCE_DIR/runtime-versions.txt"
          fi
          exit 0

      - name: Execute producer round trip
        id: producer
        if: steps.authority.outputs.exit_code == '0' && steps.runtime.outputs.exit_code == '0'
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/run-powertab-producer.sh" <<'BASH'
          #!/usr/bin/env bash
          set -Eeuo pipefail

          WORK="$RUNNER_TEMP/powertab-producer-work"
          INSTALLER="$WORK/powertabeditor-windows-2.0.22.exe"
          EXTRACTED="$WORK/extracted"
          WINEPREFIX_DIR="$WORK/wine-prefix"
          APP_LOG="$EVIDENCE_DIR/powertabeditor.log"
          WINDOW_LOG="$EVIDENCE_DIR/window-inventory.txt"
          mkdir -p "$WORK" "$EXTRACTED" "$EVIDENCE_DIR"

          if command -v wine >/dev/null 2>&1; then
            WINE_BIN="$(command -v wine)"
          elif command -v wine64 >/dev/null 2>&1; then
            WINE_BIN="$(command -v wine64)"
          else
            echo "Neither wine nor wine64 is available." >&2
            exit 20
          fi

          curl --fail --location --retry 3 --retry-delay 2 \
            --output "$INSTALLER" \
            "https://github.com/powertab/powertabeditor/releases/download/2.0.22/powertabeditor-windows-2.0.22.exe"
          actual_installer_hash="$(sha256sum "$INSTALLER" | awk '{print $1}')"
          printf '%s  %s\n' "$actual_installer_hash" "$(basename "$INSTALLER")" \
            > "$EVIDENCE_DIR/installer-sha256.txt"
          if [ "$actual_installer_hash" != "$INSTALLER_SHA256" ]; then
            echo "Installer SHA-256 mismatch: expected $INSTALLER_SHA256, actual $actual_installer_hash" >&2
            exit 21
          fi

          innoextract --silent --output-dir "$EXTRACTED" "$INSTALLER" \
            > "$EVIDENCE_DIR/innoextract.log" 2>&1
          APP_EXE="$(find "$EXTRACTED" -type f -iname 'powertabeditor.exe' -print -quit)"
          if [ -z "$APP_EXE" ] || [ ! -f "$APP_EXE" ]; then
            echo "Packaged powertabeditor.exe was not found." >&2
            find "$EXTRACTED" -maxdepth 4 -type f | sort >&2
            exit 22
          fi
          sha256sum "$APP_EXE" > "$EVIDENCE_DIR/powertabeditor-executable-sha256.txt"
          printf '%s\n' "$APP_EXE" > "$EVIDENCE_DIR/powertabeditor-executable-path.txt"

          cp "$FIXTURE_PATH" "$EVIDENCE_DIR/source-derived-input.pt2"
          cp "$FIXTURE_PATH" "$EDITOR_FILE"
          touch -d '2000-01-01 00:00:00 UTC' "$EDITOR_FILE"
          before_mtime="$(stat -c %Y "$EDITOR_FILE")"
          before_inode="$(stat -c %i "$EDITOR_FILE")"
          before_size="$(stat -c %s "$EDITOR_FILE")"
          before_hash="$(sha256sum "$EDITOR_FILE" | awk '{print $1}')"
          printf 'mtime=%s\ninode=%s\nsize=%s\nsha256=%s\n' \
            "$before_mtime" "$before_inode" "$before_size" "$before_hash" \
            > "$EVIDENCE_DIR/before-save-stat.txt"

          export WINEARCH=win64
          export WINEPREFIX="$WINEPREFIX_DIR"
          export WINEDEBUG=-all

          xvfb-run -a -s '-screen 0 1280x900x24' bash -Eeuo pipefail <<XVFB
          export WINEARCH=win64
          export WINEPREFIX="$WINEPREFIX_DIR"
          export WINEDEBUG=-all

          "$WINE_BIN" wineboot --init > "$EVIDENCE_DIR/wineboot.log" 2>&1 || true
          "$WINE_BIN" "$APP_EXE" --version > "$EVIDENCE_DIR/powertabeditor-version.txt" 2>&1
          grep -q '2\.0\.22' "$EVIDENCE_DIR/powertabeditor-version.txt"

          WIN_EDITOR_FILE="\$(winepath -w "$EDITOR_FILE")"
          "$WINE_BIN" "$APP_EXE" "\$WIN_EDITOR_FILE" > "$APP_LOG" 2>&1 &
          APP_PID=\$!

          WINDOW_ID=""
          for attempt in \$(seq 1 60); do
            WINDOW_ID="\$(xdotool search --onlyvisible --name 'Power Tab Editor' 2>/dev/null | tail -n 1 || true)"
            if [ -n "\$WINDOW_ID" ]; then
              break
            fi
            if ! kill -0 "\$APP_PID" 2>/dev/null; then
              break
            fi
            sleep 1
          done

          xwininfo -root -tree > "$WINDOW_LOG" 2>&1 || true
          import -window root "$EVIDENCE_DIR/before-save.png" 2> "$EVIDENCE_DIR/screenshot-before.log" || true

          if [ -z "\$WINDOW_ID" ]; then
            echo 'Power Tab Editor window was not found.' >&2
            cat "$APP_LOG" >&2 || true
            exit 23
          fi

          xdotool getwindowname "\$WINDOW_ID" > "$EVIDENCE_DIR/window-title.txt" 2>&1 || true
          xdotool windowactivate --sync "\$WINDOW_ID"
          sleep 4
          xdotool key --window "\$WINDOW_ID" --clearmodifiers ctrl+s

          rewritten=0
          for attempt in \$(seq 1 20); do
            current_mtime="\$(stat -c %Y "$EDITOR_FILE")"
            if [ "\$current_mtime" -gt 946684800 ]; then
              rewritten=1
              break
            fi
            sleep 1
          done

          import -window root "$EVIDENCE_DIR/after-save.png" 2> "$EVIDENCE_DIR/screenshot-after.log" || true
          xdotool key --window "\$WINDOW_ID" --clearmodifiers alt+F4 || true
          sleep 3
          kill "\$APP_PID" 2>/dev/null || true
          "$WINE_BIN" wineserver -w 2>/dev/null || true

          if [ "\$rewritten" != "1" ]; then
            echo 'The graphical Save command produced no observable rewrite.' >&2
            exit 24
          fi
          XVFB

          after_mtime="$(stat -c %Y "$EDITOR_FILE")"
          after_inode="$(stat -c %i "$EDITOR_FILE")"
          after_size="$(stat -c %s "$EDITOR_FILE")"
          after_hash="$(sha256sum "$EDITOR_FILE" | awk '{print $1}')"
          printf 'mtime=%s\ninode=%s\nsize=%s\nsha256=%s\n' \
            "$after_mtime" "$after_inode" "$after_size" "$after_hash" \
            > "$EVIDENCE_DIR/after-save-stat.txt"
          if [ "$after_mtime" -le 946684800 ]; then
            echo "Rewritten file retained the forced pre-2001 mtime." >&2
            exit 25
          fi

          python3 - <<'PY'
          import gzip
          import hashlib
          import json
          import os
          from pathlib import Path

          evidence = Path(os.environ["EVIDENCE_DIR"])
          source_path = evidence / "source-derived-input.pt2"
          editor_path = Path(os.environ["EDITOR_FILE"])

          def load(path):
              compressed = path.read_bytes()
              decompressed = gzip.decompress(compressed)
              value = json.loads(decompressed.decode("utf-8"))
              return compressed, decompressed, value

          source_compressed, source_decompressed, source = load(source_path)
          editor_compressed, editor_decompressed, editor = load(editor_path)

          if source.get("version") != 11:
              raise SystemExit(f"source internal version is {source.get('version')!r}, expected 11")
          if editor.get("version") != 11:
              raise SystemExit(f"editor internal version is {editor.get('version')!r}, expected 11")

          (evidence / "source-derived-input.json").write_text(
              json.dumps(source, indent=2, ensure_ascii=False) + "\n", encoding="utf-8"
          )
          (evidence / "editor-resaved-output.json").write_text(
              json.dumps(editor, indent=2, ensure_ascii=False) + "\n", encoding="utf-8"
          )

          def describe(value):
              text = json.dumps(value, ensure_ascii=False, sort_keys=True)
              return text if len(text) <= 1000 else text[:1000] + "…"

          differences = []
          def compare(a, b, path="$", seen=None):
              if seen is None:
                  seen = set()
              pair = (id(a), id(b))
              if pair in seen:
                  return
              seen.add(pair)
              if type(a) is not type(b):
                  differences.append({"path": path, "kind": "type", "source": type(a).__name__, "editor": type(b).__name__})
                  return
              if isinstance(a, dict):
                  for key in sorted(set(a) | set(b)):
                      child = f"{path}.{key}"
                      if key not in a:
                          differences.append({"path": child, "kind": "added", "editor": describe(b[key])})
                      elif key not in b:
                          differences.append({"path": child, "kind": "removed", "source": describe(a[key])})
                      else:
                          compare(a[key], b[key], child, seen)
              elif isinstance(a, list):
                  if len(a) != len(b):
                      differences.append({"path": path, "kind": "length", "source": len(a), "editor": len(b)})
                  for index, (left, right) in enumerate(zip(a, b)):
                      compare(left, right, f"{path}[{index}]", seen)
              elif a != b:
                  differences.append({"path": path, "kind": "value", "source": describe(a), "editor": describe(b)})

          compare(source, editor)
          report = {
              "source": {
                  "compressedBytes": len(source_compressed),
                  "compressedSha256": hashlib.sha256(source_compressed).hexdigest(),
                  "decompressedBytes": len(source_decompressed),
                  "decompressedSha256": hashlib.sha256(source_decompressed).hexdigest(),
                  "internalVersion": source.get("version"),
              },
              "editor": {
                  "compressedBytes": len(editor_compressed),
                  "compressedSha256": hashlib.sha256(editor_compressed).hexdigest(),
                  "decompressedBytes": len(editor_decompressed),
                  "decompressedSha256": hashlib.sha256(editor_decompressed).hexdigest(),
                  "internalVersion": editor.get("version"),
              },
              "jsonEqual": source == editor,
              "differenceCount": len(differences),
              "differences": differences,
          }
          (evidence / "structural-comparison.json").write_text(
              json.dumps(report, indent=2, ensure_ascii=False) + "\n", encoding="utf-8"
          )
          PY

          rm -rf "$WINEPREFIX_DIR" "$EXTRACTED" "$INSTALLER"
          printf '%s\n' 'producer-round-trip-passed' > "$EVIDENCE_DIR/producer-status.txt"
          BASH

          chmod +x "$RUNNER_TEMP/run-powertab-producer.sh"
          set +e
          "$RUNNER_TEMP/run-powertab-producer.sh" \
            > "$EVIDENCE_DIR/producer-shell.log" 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" != "0" ]; then
            printf 'producer-round-trip-failed exit_code=%s\n' "$code" \
              > "$EVIDENCE_DIR/producer-status.txt"
          fi
          exit 0

      - name: Install locked project dependencies
        id: install
        if: steps.producer.outputs.exit_code == '0'
        shell: bash
        run: |
          set +e
          npm ci --no-audit --no-fund > "$EVIDENCE_DIR/npm-install.log" 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Prove semantic parity from editor-resaved file
        id: semantic
        if: steps.producer.outputs.exit_code == '0' && steps.install.outputs.exit_code == '0'
        shell: bash
        run: |
          cat > src/__powertab_editor_gate.test.js <<'TEST'
          import fs from "fs";
          import { gunzipSync } from "zlib";
          import { decodePowerTabV11Bytes } from "./powerTabV11Decoder";

          test("exact editor-resaved PowerTab file preserves the six-position semantic proof", async () => {
            const file = process.env.POWERTAB_EDITOR_EVIDENCE_FILE;
            expect(file).toBeTruthy();
            const bytes = fs.readFileSync(file);
            const intermediate = await decodePowerTabV11Bytes(bytes, {
              decompress: async (value) => new Uint8Array(gunzipSync(value)),
            });

            expect(intermediate).toMatchObject({
              sourceVersion: "PT2_V11",
              title: "Guitar Eyes PowerTab v11 Proof",
              versionEvidence: {
                internalVersion: 11,
                upstreamRelease: "2.0.22",
                upstreamCommit: "13cab27c7127d301f2747671071e53eb203dc940",
                decodedTrackCount: 1,
              },
            });
            expect(intermediate.tracks).toHaveLength(1);
            expect(intermediate.tracks[0]).toMatchObject({ name: "Proof Guitar" });
            expect(intermediate.tracks[0].staves[0].tuningMidiHighToLow).toEqual([
              64, 59, 55, 50, 45, 40,
            ]);
            expect(intermediate.tracks[0].staves[0].bars).toHaveLength(2);
            expect(
              intermediate.tracks[0].staves[0].bars.map(
                (bar) => bar.voices[0].beats.length
              )
            ).toEqual([4, 2]);
            expect(
              intermediate.tracks[0].staves[0].bars.flatMap(
                (bar) => bar.voices[0].beats.map((beat) => beat.startTicks)
              )
            ).toEqual([0, 960, 1440, 1920, 3840, 5760]);
            expect(
              intermediate.tracks[0].staves[0].bars[1].voices[0].beats[0].isRest
            ).toBe(true);
            expect(
              intermediate.tracks[0].staves[0].bars[1].voices[0].beats[1].notes
            ).toHaveLength(2);
          });
          TEST

          set +e
          POWERTAB_EDITOR_EVIDENCE_FILE="$EDITOR_FILE" \
            CI=true npm test -- --watchAll=false --runInBand \
            --runTestsByPath src/__powertab_editor_gate.test.js \
            > "$EVIDENCE_DIR/editor-semantic-test.log" 2>&1
          code=$?
          rm -f src/__powertab_editor_gate.test.js
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Run complete inherited suite
        id: tests
        if: steps.semantic.outputs.exit_code == '0'
        shell: bash
        run: |
          set +e
          CI=true npm test -- --watchAll=false --runInBand \
            > "$EVIDENCE_DIR/full-test.log" 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Build optimized application
        id: build
        if: steps.tests.outputs.exit_code == '0'
        shell: bash
        run: |
          set +e
          npm run build > "$EVIDENCE_DIR/production-build.log" 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Inspect build and asset boundary
        id: assets
        if: steps.build.outputs.exit_code == '0'
        shell: bash
        run: |
          set +e
          python3 - <<'PY' > "$EVIDENCE_DIR/build-asset-inspection.txt" 2>&1
          import hashlib
          import pathlib

          build = pathlib.Path("build")
          assert build.is_dir(), "build directory is absent"
          forbidden_suffixes = {".dll", ".exe", ".sf2", ".sf3", ".wav", ".mp3"}
          forbidden_names = []
          files = []
          for path in sorted(p for p in build.rglob("*") if p.is_file()):
              relative = path.relative_to(build).as_posix()
              data = path.read_bytes()
              files.append((relative, len(data), hashlib.sha256(data).hexdigest()))
              lower = relative.lower()
              if path.suffix.lower() in forbidden_suffixes or "powertabeditor" in lower:
                  forbidden_names.append(relative)
          assert not forbidden_names, f"forbidden built assets: {forbidden_names}"
          print(f"file count: {len(files)}")
          print(f"total bytes: {sum(size for _, size, _ in files)}")
          print("built files:")
          for relative, size, digest in files:
              print(f"{digest}  {size:>10}  {relative}")
          PY
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Write checkpoint summary
        if: always()
        shell: bash
        run: |
          cat > "$EVIDENCE_DIR/checkpoint-summary.txt" <<SUMMARY
          triggering_commit=$GITHUB_SHA
          authority_exit=${{ steps.authority.outputs.exit_code }}
          runtime_exit=${{ steps.runtime.outputs.exit_code }}
          producer_exit=${{ steps.producer.outputs.exit_code }}
          npm_install_exit=${{ steps.install.outputs.exit_code }}
          semantic_exit=${{ steps.semantic.outputs.exit_code }}
          full_tests_exit=${{ steps.tests.outputs.exit_code }}
          build_exit=${{ steps.build.outputs.exit_code }}
          assets_exit=${{ steps.assets.outputs.exit_code }}
          SUMMARY

      - name: Upload bounded evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: powertab-v11-producer-evidence-${{ github.run_id }}
          path: ${{ env.EVIDENCE_DIR }}
          if-no-files-found: error
          retention-days: 1
          compression-level: 6

      - name: Enforce completed producer checkpoint
        if: always()
        shell: bash
        run: |
          test "${{ steps.authority.outputs.exit_code }}" = "0"
          test "${{ steps.runtime.outputs.exit_code }}" = "0"
          test "${{ steps.producer.outputs.exit_code }}" = "0"
          test "${{ steps.install.outputs.exit_code }}" = "0"
          test "${{ steps.semantic.outputs.exit_code }}" = "0"
          test "${{ steps.tests.outputs.exit_code }}" = "0"
          test "${{ steps.build.outputs.exit_code }}" = "0"
          test "${{ steps.assets.outputs.exit_code }}" = "0"
