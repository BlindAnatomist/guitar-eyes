name: PowerTab v11 editor parity gate corrected

on:
  workflow_dispatch:
  push:
    branches:
      - work/powertab-pt2-v11-editor-parity
    paths:
      - .github/powertab-editor-parity-trigger

concurrency:
  group: powertab-v11-editor-parity-corrected-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  parity:
    name: Verify exact editor fixture parity corrected
    runs-on: ubuntu-24.04
    timeout-minutes: 12

    env:
      EVIDENCE_DIR: ${{ github.workspace }}/powertab-parity-evidence
      EVIDENCE_BASE: 38e4ce878ea0607051084e631e6384b9c0e7008f
      ACCEPTED_APPLICATION_SOURCE: 2a8e5951ec4ced3ce63b2df85d82e54c0ba79ea0
      FORK_MAIN_AUTHORITY: 60c2e5de0887b1bcdd426d932632946edd07d3c3
      EDITOR_BINARY_SHA256: 6494d78b001a43322362d962b21ce88029f3c7c4cf231b9e8da5af2a3bf85835
      EDITOR_JSON_SHA256: c5082b9f7dec3401b74373b037ae7fb438f77e2db86f85c10322f6313d52f5bd

    steps:
      - name: Check out exact triggering source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare evidence directory
        run: |
          mkdir -p "$EVIDENCE_DIR"
          printf '%s\n' "$GITHUB_SHA" > "$EVIDENCE_DIR/triggering-commit.txt"
          env | sort > "$EVIDENCE_DIR/runner-environment.txt"
          uname -a > "$EVIDENCE_DIR/uname.txt"

      - name: Confirm authority and byte-exact editor evidence
        id: authority
        run: |
          set +e
          python3 - <<'PY' > "$EVIDENCE_DIR/authority-and-fixture.log" 2>&1
          import base64
          import gzip
          import hashlib
          import json
          import os
          import pathlib
          import subprocess

          def git(*args):
              return subprocess.check_output(["git", *args], text=True).strip()

          expected_branch = "work/powertab-pt2-v11-editor-parity"
          actual_branch = os.environ.get("GITHUB_REF_NAME")
          assert actual_branch == expected_branch, (
              f"branch mismatch: expected {expected_branch!r}, actual {actual_branch!r}"
          )

          evidence_base = os.environ["EVIDENCE_BASE"]
          accepted = os.environ["ACCEPTED_APPLICATION_SOURCE"]
          subprocess.run(["git", "merge-base", "--is-ancestor", evidence_base, "HEAD"], check=True)
          subprocess.run(["git", "merge-base", "--is-ancestor", accepted, "HEAD"], check=True)

          expected_files = {
              ".github/powertab-editor-parity-trigger",
              ".github/workflows/powertab-pt2-v11-parity-gate-v2.yml",
              "fixtures/powertab-v11/powertab-v11-editor-export-six-position.json",
              "src/powerTabV11Decoder.test.js",
              "src/powerTabV11PositionParser.js",
          }
          actual_files = set(
              filter(None, git("diff", "--name-only", f"{evidence_base}..HEAD").splitlines())
          )
          assert actual_files == expected_files, (
              "changed-file boundary mismatch\n"
              f"expected: {sorted(expected_files)}\n"
              f"actual:   {sorted(actual_files)}"
          )

          expected_trigger = "PowerTab v11 editor parity gate: corrected run 2 on 2026-08-05.\n"
          trigger_path = pathlib.Path(".github/powertab-editor-parity-trigger")
          trigger = trigger_path.read_text(encoding="utf-8")
          assert trigger == expected_trigger, (
              f"trigger mismatch: expected {expected_trigger!r}, actual {trigger!r}"
          )

          remote_main = git("ls-remote", "origin", "refs/heads/main").split()[0]
          assert remote_main == os.environ["FORK_MAIN_AUTHORITY"], (
              f"fork main mismatch: expected {os.environ['FORK_MAIN_AUTHORITY']}, actual {remote_main}"
          )

          binary_path = pathlib.Path(
              "fixtures/powertab-v11/powertab-v11-editor-export-six-position.pt2"
          )
          json_path = pathlib.Path(
              "fixtures/powertab-v11/powertab-v11-editor-export-six-position.json"
          )
          mirror_path = pathlib.Path(
              "fixtures/powertab-v11/powertab-v11-editor-export-six-position.pt2.base64"
          )
          binary = binary_path.read_bytes()
          decompressed = gzip.decompress(binary)
          committed_json = json_path.read_bytes()
          mirror = base64.b64decode(mirror_path.read_text(encoding="utf-8").strip())

          binary_hash = hashlib.sha256(binary).hexdigest()
          json_hash = hashlib.sha256(decompressed).hexdigest()
          committed_json_hash = hashlib.sha256(committed_json).hexdigest()
          assert binary_hash == os.environ["EDITOR_BINARY_SHA256"], (
              f"editor binary hash mismatch: expected {os.environ['EDITOR_BINARY_SHA256']}, actual {binary_hash}"
          )
          assert json_hash == os.environ["EDITOR_JSON_SHA256"], (
              f"decompressed JSON hash mismatch: expected {os.environ['EDITOR_JSON_SHA256']}, actual {json_hash}"
          )
          assert committed_json_hash == os.environ["EDITOR_JSON_SHA256"], (
              f"committed JSON hash mismatch: expected {os.environ['EDITOR_JSON_SHA256']}, actual {committed_json_hash}"
          )
          assert decompressed == committed_json, "decompressed editor bytes differ from committed JSON audit"
          assert mirror == binary, "base64 mirror differs from exact editor binary"
          document = json.loads(decompressed.decode("utf-8"))
          assert document.get("version") == 11, (
              f"internal version mismatch: expected 11, actual {document.get('version')!r}"
          )
          assert "bootleg_relaese_info" in document["score"]["score_info"]["song_data"], (
              "producer-authored field spelling was normalized rather than preserved byte-exactly"
          )

          forbidden_temporary = [
              ".github/powertab-producer-gate.sh",
              ".github/powertab-structural-compare.py",
              ".github/powertab-editor-semantic-gate.test.js",
              ".github/powertab-editor-evidence-trigger",
              ".github/workflows/powertab-pt2-v11-producer-gate-v4.yml",
          ]
          present = [path for path in forbidden_temporary if pathlib.Path(path).exists()]
          assert not present, f"temporary producer files remain: {present}"

          print(f"branch: {actual_branch}")
          print(f"head: {git('rev-parse', 'HEAD')}")
          print(f"evidence base: {evidence_base}")
          print(f"fork main: {remote_main}")
          print(f"editor binary bytes: {len(binary)}")
          print(f"editor binary SHA-256: {binary_hash}")
          print(f"editor JSON bytes: {len(decompressed)}")
          print(f"editor JSON SHA-256: {json_hash}")
          print("changed files:")
          for path in sorted(actual_files):
              print(f"- {path}")
          PY
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Install locked dependencies
        id: install
        if: steps.authority.outputs.exit_code == '0'
        run: |
          set +e
          npm ci --no-audit --no-fund > "$EVIDENCE_DIR/npm-install.log" 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Run focused PowerTab editor parity tests
        id: focused
        if: steps.authority.outputs.exit_code == '0' && steps.install.outputs.exit_code == '0'
        run: |
          set +e
          CI=true npm test -- --watchAll=false --runInBand \
            --runTestsByPath src/powerTabV11Decoder.test.js \
            > "$EVIDENCE_DIR/focused-test.log" 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Run complete inherited suite
        id: tests
        if: steps.authority.outputs.exit_code == '0' && steps.install.outputs.exit_code == '0' && steps.focused.outputs.exit_code == '0'
        run: |
          set +e
          CI=true npm test -- --watchAll=false --runInBand \
            > "$EVIDENCE_DIR/full-test.log" 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Build optimized application
        id: build
        if: steps.authority.outputs.exit_code == '0' && steps.install.outputs.exit_code == '0' && steps.focused.outputs.exit_code == '0' && steps.tests.outputs.exit_code == '0'
        run: |
          set +e
          npm run build > "$EVIDENCE_DIR/production-build.log" 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Inspect bundle and checkout boundary
        id: assets
        if: steps.authority.outputs.exit_code == '0' && steps.install.outputs.exit_code == '0' && steps.focused.outputs.exit_code == '0' && steps.tests.outputs.exit_code == '0' && steps.build.outputs.exit_code == '0'
        run: |
          set +e
          python3 - <<'PY' > "$EVIDENCE_DIR/build-asset-inspection.txt" 2>&1
          import hashlib
          import pathlib
          import subprocess

          build = pathlib.Path("build")
          assert build.is_dir(), "build directory is absent"
          forbidden = []
          files = []
          for path in sorted(p for p in build.rglob("*") if p.is_file()):
              relative = path.relative_to(build).as_posix()
              data = path.read_bytes()
              files.append((relative, len(data), hashlib.sha256(data).hexdigest()))
              if (
                  path.suffix.lower() in {".dll", ".exe", ".pt2", ".sf2", ".sf3", ".wav", ".mp3"}
                  or "powertabeditor" in relative.lower()
              ):
                  forbidden.append(relative)
          assert not forbidden, f"forbidden built assets: {forbidden}"
          status = subprocess.check_output(
              ["git", "status", "--short", "--untracked-files=no"], text=True
          ).strip()
          assert not status, f"verification modified tracked files:\n{status}"
          print(f"file count: {len(files)}")
          print(f"total bytes: {sum(size for _, size, _ in files)}")
          print("built files:")
          for relative, size, digest in files:
              print(f"{digest}  {size:>10}  {relative}")
          PY
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Write checkpoint summary
        if: always()
        run: |
          cat > "$EVIDENCE_DIR/checkpoint-summary.txt" <<SUMMARY
          triggering_commit=$GITHUB_SHA
          authority_exit=${{ steps.authority.outputs.exit_code }}
          npm_install_exit=${{ steps.install.outputs.exit_code }}
          focused_test_exit=${{ steps.focused.outputs.exit_code }}
          full_tests_exit=${{ steps.tests.outputs.exit_code }}
          build_exit=${{ steps.build.outputs.exit_code }}
          assets_exit=${{ steps.assets.outputs.exit_code }}
          SUMMARY

      - name: Upload bounded parity evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: powertab-v11-editor-parity-corrected-${{ github.run_id }}
          path: ${{ env.EVIDENCE_DIR }}
          if-no-files-found: error
          retention-days: 1
          compression-level: 6

      - name: Enforce completed parity checkpoint
        if: always()
        run: |
          test "${{ steps.authority.outputs.exit_code }}" = "0"
          test "${{ steps.install.outputs.exit_code }}" = "0"
          test "${{ steps.focused.outputs.exit_code }}" = "0"
          test "${{ steps.tests.outputs.exit_code }}" = "0"
          test "${{ steps.build.outputs.exit_code }}" = "0"
          test "${{ steps.assets.outputs.exit_code }}" = "0"
