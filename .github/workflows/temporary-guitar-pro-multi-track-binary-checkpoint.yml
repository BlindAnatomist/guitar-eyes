name: Temporary Guitar Pro multi-track binary checkpoint

on:
  push:
    branches:
      - work/tablature-intake-expansion

concurrency:
  group: temporary-guitar-pro-multi-track-binary-checkpoint
  cancel-in-progress: true

permissions:
  contents: write
  statuses: write

jobs:
  verify:
    if: github.event.head_commit.message != 'Complete Guitar Pro multi-track binary proof 3D [generated-multi-track]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/tablature-intake-expansion
          fetch-depth: 0

      - name: Confirm track-selection ancestry and clean checkout
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor eb3645c358735bfec99920a41d26fc1355a216ba HEAD
          test -z "$(git status --short)"

      - name: Apply multi-track binary checkpoint
        id: edit
        shell: bash
        run: |
          set +e
          set -o pipefail
          python scripts/temporary_guitar_pro_multi_track_binary_checkpoint.py 2>&1 | tee /tmp/multi-track-edit.log
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload edit diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: guitar-pro-multi-track-edit-diagnostics
          path: /tmp/multi-track-edit.log
          if-no-files-found: error
          retention-days: 1

      - name: Enforce edit result
        run: test "${{ steps.edit.outputs.exit_code }}" = "0"

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install and generate deterministic fixtures
        id: generation
        shell: bash
        env:
          npm_config_cache: /tmp/guitar-eyes-multi-track-npm-cache
        run: |
          set +e
          set -o pipefail
          npm install --ignore-scripts --no-audit --no-fund
          install_code=$?
          if [ "$install_code" -ne 0 ]; then
            echo "exit_code=$install_code" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          npm run generate:guitar-pro-archive-proof 2>&1 | tee /tmp/single-track-generation.log
          single_code=${PIPESTATUS[0]}
          if [ "$single_code" -ne 0 ]; then
            echo "exit_code=$single_code" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          npm run generate:guitar-pro-multi-track-proof 2>&1 | tee /tmp/multi-track-generation.log
          multi_code=${PIPESTATUS[0]}
          echo "exit_code=$multi_code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload generation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: guitar-pro-multi-track-generation-diagnostics
          path: |
            /tmp/single-track-generation.log
            /tmp/multi-track-generation.log
          if-no-files-found: warn
          retention-days: 1

      - name: Enforce generation and checksums
        run: |
          test "${{ steps.generation.outputs.exit_code }}" = "0"
          (cd fixtures/real-world && sha256sum -c guitar-pro-shared-archive-proof.gp.sha256)
          (cd fixtures/real-world && sha256sum -c guitar-pro-multi-track-proof.gp.sha256)
          test "$(stat -c %s fixtures/real-world/guitar-pro-multi-track-proof.gp)" -le $((5 * 1024 * 1024))

      - name: Run complete test suite
        id: tests
        env:
          CI: true
        shell: bash
        run: |
          set +e
          set -o pipefail
          npm test -- --watchAll=false --runInBand 2>&1 | tee /tmp/multi-track-tests.log
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload test diagnostics on failure
        if: steps.tests.outputs.exit_code != '0'
        uses: actions/upload-artifact@v4
        with:
          name: guitar-pro-multi-track-test-diagnostics
          path: /tmp/multi-track-tests.log
          if-no-files-found: error
          retention-days: 1

      - name: Enforce tests
        run: test "${{ steps.tests.outputs.exit_code }}" = "0"

      - name: Build production application
        run: npm run build | tee /tmp/multi-track-build.log

      - name: Inspect build and source boundary
        shell: python
        run: |
          from pathlib import Path
          import json

          build = Path('build')
          html = (build / 'index.html').read_text(encoding='utf-8')
          assert '<title>Test build Guitar Pro multi-track binary proof 3D</title>' in html
          assert 'Test build: Guitar Pro multi-track binary proof 3D.' in html

          js_files = sorted(build.rglob('*.js'))
          main_files = [path for path in js_files if path.name.startswith('main.')]
          assert len(main_files) == 1, main_files
          main = main_files[0]
          main_text = main.read_text(encoding='utf-8', errors='ignore')

          for forbidden in ['No score.gpif found in zip archive', 'alphaSynth']:
              assert forbidden not in main_text, forbidden

          lazy_matches = []
          for path in js_files:
              if path == main:
                  continue
              text = path.read_text(encoding='utf-8', errors='ignore')
              if any(marker in text for marker in [
                  'No score.gpif found in zip archive',
                  'ScoreLoader',
                  'Guitar Pro 7-8',
              ]):
                  lazy_matches.append(path)
          assert lazy_matches, 'lazy alphaTab decoder chunk not found'

          forbidden_assets = []
          for path in build.rglob('*'):
              if not path.is_file():
                  continue
              lower = path.as_posix().lower()
              if any(token in lower for token in [
                  'bravura', 'soundfont', '.sf2', '.sf3', '.woff', '.woff2',
                  'alphatab.worker', 'alphatab.worklet', 'audio-worklet', 'synth.worker'
              ]):
                  forbidden_assets.append(path.as_posix())
          assert not forbidden_assets, forbidden_assets

          report = {
              'main': main.relative_to(build).as_posix(),
              'main_bytes': main.stat().st_size,
              'lazy_decoder_chunks': [path.relative_to(build).as_posix() for path in lazy_matches],
              'lazy_decoder_bytes': sum(path.stat().st_size for path in lazy_matches),
              'multi_track_fixture_bytes': Path('fixtures/real-world/guitar-pro-multi-track-proof.gp').stat().st_size,
          }
          Path('/tmp/multi-track-build-report.json').write_text(
              json.dumps(report, indent=2, sort_keys=True),
              encoding='utf-8',
          )
          print(json.dumps(report, indent=2, sort_keys=True))

      - name: Upload successful verification report
        uses: actions/upload-artifact@v4
        with:
          name: guitar-pro-multi-track-verification
          path: |
            /tmp/multi-track-tests.log
            /tmp/multi-track-build.log
            /tmp/multi-track-build-report.json
            /tmp/multi-track-generation.log
          if-no-files-found: error
          retention-days: 1

      - name: Require exact multi-track proof evidence
        run: |
          test -s fixtures/real-world/guitar-pro-multi-track-proof.atex
          test -s fixtures/real-world/guitar-pro-multi-track-proof.gp
          test -s fixtures/real-world/guitar-pro-multi-track-proof.gp.sha256
          grep -F 'Proof Guitar' fixtures/real-world/guitar-pro-multi-track-proof.atex >/dev/null
          grep -F 'Proof Bass' fixtures/real-world/guitar-pro-multi-track-proof.atex >/dev/null
          grep -F 'drives inventory and explicit bass selection from project-authored multi-track bytes' src/guitarProBinaryProof.test.js >/dev/null
          grep -F 'Guitar Pro multi-track binary proof 3D' src/App.js public/index.html docs/implementation-status.md >/dev/null

      - name: Commit verified checkpoint
        run: |
          rm -f scripts/temporary_guitar_pro_multi_track_binary_checkpoint.py
          rm -f .github/workflows/temporary-guitar-pro-multi-track-binary-checkpoint.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m 'Complete Guitar Pro multi-track binary proof 3D [generated-multi-track]'
          git push origin HEAD:work/tablature-intake-expansion

      - name: Record success status
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "{\"state\":\"success\",\"context\":\"guitar-eyes/multi-track-3d\",\"description\":\"Multi-track binary generation, selection, tests and build passed\",\"target_url\":\"https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}"

      - name: Record failure status
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "{\"state\":\"failure\",\"context\":\"guitar-eyes/multi-track-3d\",\"description\":\"Inspect bounded multi-track binary checkpoint failure\",\"target_url\":\"https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}"
