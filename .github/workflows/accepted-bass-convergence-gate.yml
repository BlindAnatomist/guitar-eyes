name: Accepted bass convergence gate

on:
  push:
    branches:
      - work/accepted-bass-convergence-gate

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact convergence candidate
        uses: actions/checkout@v4
        with:
          ref: 67a062085c93d9fb546194d727c808960bbcaea9

      - name: Confirm exact candidate
        run: test "$(git rev-parse HEAD)" = "67a062085c93d9fb546194d727c808960bbcaea9"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Run convergence-focused tests
        run: CI=true npm test -- --watchAll=false --runTestsByPath src/powerTabBassConvergence.test.js src/powerTabSourceNormalizer.bass.test.js src/tuxGuitarBassCompatibility.test.js

      - name: Run complete inherited suite
        run: CI=true npm test -- --watchAll=false

      - name: Build production application
        run: npm run build
