name: Temporary Guitar Pro shared archive correction

on:
  push:
    branches:
      - work/tablature-intake-expansion

concurrency:
  group: temporary-guitar-pro-shared-archive-correction
  cancel-in-progress: true

permissions:
  contents: write
  statuses: write

jobs:
  correct:
    if: github.event.head_commit.message != 'Complete Guitar Pro shared archive identity correction [generated-shared-archive]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/tablature-intake-expansion
          fetch-depth: 0

      - name: Confirm corrected normalizer ancestry
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor 2b37a725148f12f2279690d5b6e0bc9bf5de0519 HEAD
          test -z "$(git status --short)"

      - name: Prepare temporary correction script
        shell: python
        run: |
          from pathlib import Path
          path = Path('scripts/temporary_guitar_pro_shared_archive_correction.py')
          text = path.read_text(encoding='utf-8')

          old = '    original = read(path)\n'
          new = '    try:\n        original = read(path)\n    except UnicodeDecodeError:\n        continue\n'
          assert text.count(old) == 1, text.count(old)
          text = text.replace(old, new, 1)

          start_marker = 'assert text.count(\'sourceVersion: "GP7",\') == 2\n'
          end_marker = 'old_version_test = textwrap.dedent(\n'
          assert text.count(start_marker) == 1
          assert text.count(end_marker) == 1
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          replacement = '''helper_start = text.index("function intermediate(")
          helper_end = text.index("\\n}\\n\\nfunction expectErrorCode", helper_start) + 2
          helper = text[helper_start:helper_end]
          helper = replace_once(
              helper,
              '    sourceVersion: "GP7",\\n',
              '    sourceVersion: "GP8",\\n    versionEvidence: GP8_VERSION_EVIDENCE,\\n',
              "normalizer helper evidence",
          )
          text = text[:helper_start] + helper + text[helper_end:]
          text = replace_once(
              text,
              '      sourceVersion: "GP7",\\n      title: "Guitar Eyes Shared Archive Proof",',
              '      sourceVersion: "GP8",\\n      title: "Guitar Eyes Shared Archive Proof",',
              "normalizer expected GP8 version",
          )
          '''
          text = text[:start] + replacement + text[end:]
          path.write_text(text, encoding='utf-8')

      - name: Apply shared archive correction
        id: edit
        shell: bash
        run: |
          set +e
          set -o pipefail
          python scripts/temporary_guitar_pro_shared_archive_correction.py 2>&1 | tee /tmp/shared-archive-edit.log
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload edit diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: guitar-pro-shared-archive-edit-diagnostic
          path: /tmp/shared-archive-edit.log
          if-no-files-found: error
          retention-days: 1

      - name: Enforce edit result
        run: test "${{ steps.edit.outputs.exit_code }}" = "0"

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install and regenerate proof
        env:
          npm_config_cache: /tmp/guitar-eyes-shared-archive-npm-cache
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm run generate:guitar-pro-archive-proof
          (cd fixtures/real-world && sha256sum -c guitar-pro-shared-archive-proof.gp.sha256)

      - name: Run complete test suite
        id: tests
        env:
          CI: true
        shell: bash
        run: |
          set +e
          set -o pipefail
          npm test -- --watchAll=false --runInBand 2>&1 | tee /tmp/shared-archive-tests.log
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload test diagnostics on failure
        if: steps.tests.outputs.exit_code != '0'
        uses: actions/upload-artifact@v4
        with:
          name: guitar-pro-shared-archive-test-diagnostics
          path: /tmp/shared-archive-tests.log
          if-no-files-found: error
          retention-days: 1

      - name: Enforce tests
        run: test "${{ steps.tests.outputs.exit_code }}" = "0"

      - name: Build production application
        run: npm run build | tee /tmp/shared-archive-build.log

      - name: Reject stale current identities
        run: |
          ! grep -RInE 'decodeGuitarPro7ProofFile|buildGuitarPro7ProofReaderDocuments|guitar-eyes-gp7-import|guitar-pro-7-proof|generate:gp7-proof|generate-guitar-pro-7-proof|Guitar Pro 7 tablature|sourceFormat: "guitar-pro-7"|CORRUPT_GP7_ARCHIVE|GP7_PLUS_ZIP' src public scripts fixtures package.json docs/implementation-status.md
          ! grep -RIn 'sourceVersion: "GP7"' src --exclude='guitarProArchiveVersion.test.js' --exclude='guitarProNormalizer.test.js'
          grep -F 'sourceVersion: "GP7"' src/guitarProNormalizer.test.js >/dev/null
          grep -F 'sourceVersion: "GP8"' src/guitarProBinaryProof.test.js >/dev/null
          grep -F 'guitar-eyes-guitar-pro-import' src/guitarProBrowserWorkerFactory.js >/dev/null
          grep -F 'Test build: Guitar Pro shared-archive proof 3B.' public/index.html >/dev/null

      - name: Commit verified correction
        run: |
          rm -f scripts/temporary_guitar_pro_shared_archive_correction.py
          rm -f .github/workflows/temporary-guitar-pro-version-inventory.yml
          rm -f .github/workflows/temporary-guitar-pro-shared-archive-correction.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m 'Complete Guitar Pro shared archive identity correction [generated-shared-archive]'
          git push origin HEAD:work/tablature-intake-expansion

      - name: Record success status
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "{\"state\":\"success\",\"context\":\"guitar-eyes/shared-archive-correction\",\"description\":\"Identity correction, tests, generation and build passed\",\"target_url\":\"https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}"

      - name: Record failure status
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "{\"state\":\"failure\",\"context\":\"guitar-eyes/shared-archive-correction\",\"description\":\"Inspect bounded shared-archive correction failure\",\"target_url\":\"https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}"
