name: Deploy iPhone proof to GitHub Pages

on:
  push:
    branches:
      - work/iphone-voiceover-tablature-audit
    paths-ignore:
      - docs/hosted-preview-status.md
      - docs/proof-automated-results.md
      - docs/baseline-automated-results.md
  workflow_dispatch:

concurrency:
  group: guitar-eyes-iphone-proof-pages
  cancel-in-progress: true

permissions:
  actions: read
  checks: read
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    name: Build isolated iPhone proof
    runs-on: ubuntu-latest
    steps:
      - name: Check out audit branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Build for repository Pages path
        env:
          PUBLIC_URL: /guitar-eyes
        run: npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload proof artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    name: Publish isolated iPhone proof
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  record:
    name: Record hosted preview status
    if: always()
    needs:
      - build
      - deploy
    runs-on: ubuntu-latest
    steps:
      - name: Check out audit branch
        uses: actions/checkout@v4
        with:
          ref: work/iphone-voiceover-tablature-audit

      - name: Collect failed deployment diagnostics
        if: needs.deploy.result != 'success'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          jobs_json=$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs")
          printf '%s\n' "$jobs_json" > workflow-jobs.json
          job_id=$(printf '%s\n' "$jobs_json" | jq -r '.jobs[] | select(.name == "Publish isolated iPhone proof") | .id' | tail -n 1)
          if [ -z "$job_id" ] || [ "$job_id" = 'null' ]; then
            printf '%s\n' 'The failed deployment job ID could not be resolved.' > deploy-diagnostic.log
            exit 0
          fi

          {
            echo 'Deployment job metadata:'
            gh api "/repos/$GITHUB_REPOSITORY/actions/jobs/$job_id" \
              --jq '{name,status,conclusion,started_at,completed_at,steps}'
            echo
            check_url=$(gh api "/repos/$GITHUB_REPOSITORY/actions/jobs/$job_id" --jq '.check_run_url')
            check_id=${check_url##*/}
            echo 'Check annotations:'
            if [ -n "$check_id" ] && [ "$check_id" != 'null' ]; then
              gh api "/repos/$GITHUB_REPOSITORY/check-runs/$check_id/annotations" \
                --jq '.[] | {annotation_level,title,message,raw_details}'
            else
              echo 'No check-run identifier was available.'
            fi
            echo
            echo 'Failed job log attempt:'
            for attempt in 1 2 3 4 5; do
              gh run view "$GITHUB_RUN_ID" --log-failed > failed-run.log 2>&1
              if [ -s failed-run.log ] && ! grep -q 'BlobNotFound' failed-run.log; then
                break
              fi
              sleep 5
            done
            if [ -s failed-run.log ]; then
              tail -n 120 failed-run.log
            else
              echo 'No failed-run log was available.'
            fi
          } > deploy-diagnostic.log 2>&1
          exit 0

      - name: Write hosted preview status
        shell: bash
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
        run: |
          mkdir -p docs
          {
            echo '# iPhone Proof Hosted Preview Status'
            echo
            echo "Source commit: \`$GITHUB_SHA\`"
            echo
            echo "Build job: \`$BUILD_RESULT\`"
            echo
            echo "Deployment job: \`$DEPLOY_RESULT\`"
            echo
            if [ "$DEPLOY_RESULT" = 'success' ]; then
              echo 'Preview URL: `https://blindanatomist.github.io/guitar-eyes/`'
              echo
              echo 'The isolated preview is deployed from the audit branch. It does not alter Jason Washburn’s upstream repository or any existing production site.'
            else
              echo 'Preview URL: Not available.'
              echo
              echo 'No hosted preview is accepted yet. A failed or skipped deployment must be resolved before real-iPhone acceptance.'
              echo
              echo '## Deployment diagnostic'
              echo
              if [ -f deploy-diagnostic.log ]; then
                tail -n 180 deploy-diagnostic.log | sed 's/^/    /'
              else
                echo '    No deployment diagnostic was collected.'
              fi
            fi
          } > docs/hosted-preview-status.md

      - name: Commit hosted preview status
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/hosted-preview-status.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'docs: record hosted preview status [skip ci]'
          git push
