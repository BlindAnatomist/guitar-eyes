name: Iowa proof 1K identity gate

on:
  push:
    branches:
      - work/iowa-sample-integrity-focus-proof-1k
    paths:
      - .github/workflows/iowa-proof-1k-identity-gate.yml

permissions:
  contents: write
  statuses: write

concurrency:
  group: guitar-eyes-iowa-proof-1k-identity-gate
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      BRANCH_NAME: work/iowa-sample-integrity-focus-proof-1k
      BASE_SHA: 4fe0685f8b13f1e97424305fd59491e0e0da026b
      STATUS_CONTEXT: guitar-eyes/iowa-proof-1k-identity-gate
    steps:
      - name: Mark source pending
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'pending',
              context: process.env.STATUS_CONTEXT,
              description: 'Verifying exact 1K identity, tests, and production build',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

      - name: Check out exact source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Verify bounded identity diff
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "$BRANCH_NAME"
          test -z "$(git status --short)"
          python3 - <<'PY'
          import os
          import subprocess
          expected = {
              'public/index.html',
              'src/IPhoneTabReader.js',
              'src/buildIdentity.test.js',
              'src/checkpointBuildIdentity.test.js',
              '.github/workflows/iowa-proof-1k-identity-gate.yml',
          }
          actual = set(subprocess.check_output(
              ['git', 'diff', '--name-only', os.environ['BASE_SHA'], 'HEAD'],
              text=True,
          ).splitlines())
          if actual != expected:
              raise SystemExit(f'Identity boundary mismatch: {sorted(actual)}')
          PY
          grep -Fq 'Guitar Eyes Iowa sample integrity and focus proof 1K' src/IPhoneTabReader.js
          grep -Fq '<title>Test build Guitar Eyes Iowa sample integrity and focus proof 1K</title>' public/index.html
          grep -Fq 'Test build: Guitar Eyes Iowa sample integrity and focus proof 1K.' public/index.html

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install exact dependencies
        run: npm ci --no-audit --no-fund

      - name: Run complete test suite
        env:
          CI: true
        run: npm test -- --watchAll=false --runInBand

      - name: Build production candidate
        env:
          CI: "false"
          PUBLIC_URL: /guitar-eyes
        run: npm run build

      - name: Inspect compiled identity and samples
        shell: bash
        run: |
          set -euo pipefail
          main_js="$(find build/static/js -maxdepth 1 -type f -name 'main.*.js' | head -n 1)"
          test -n "$main_js"
          grep -Fq '<title>Test build Guitar Eyes Iowa sample integrity and focus proof 1K</title>' build/index.html
          grep -Fq 'Test build: Guitar Eyes Iowa sample integrity and focus proof 1K.' build/index.html
          grep -Fq 'Guitar Eyes Iowa sample integrity and focus proof 1K' "$main_js"
          grep -Fq 'Guitar Eyes Iowa sample integrity and focus proof 1K' build/samples/iowa-guitar/manifest.json
          for source in public/samples/iowa-guitar/*.wav; do
            built="build/samples/iowa-guitar/$(basename "$source")"
            test -f "$built"
            cmp --silent "$source" "$built"
          done

      - name: Remove temporary gate and commit exact source
        id: finalize
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/iowa-proof-1k-identity-gate.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/iowa-proof-1k-identity-gate.yml
          git commit -m 'Finalize Iowa sample integrity and focus proof 1K identity'
          final_sha="$(git rev-parse HEAD)"
          echo "final_sha=$final_sha" >> "$GITHUB_OUTPUT"
          git push origin "HEAD:$BRANCH_NAME"

      - name: Mark final source successful
        uses: actions/github-script@v7
        env:
          FINAL_SHA: ${{ steps.finalize.outputs.final_sha }}
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: process.env.FINAL_SHA,
              state: 'success',
              context: process.env.STATUS_CONTEXT,
              description: 'All 275 tests, production build, identity, and sample bytes passed',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

      - name: Mark trigger failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'failure',
              context: process.env.STATUS_CONTEXT,
              description: 'The exact 1K identity gate failed',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
