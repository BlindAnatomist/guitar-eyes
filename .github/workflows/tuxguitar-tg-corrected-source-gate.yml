name: TuxGuitar TG corrected source gate

on:
  push:
    branches:
      - work/tuxguitar-tg-intake-investigation
    paths:
      - .github/workflows/tuxguitar-tg-corrected-source-gate.yml

concurrency:
  group: tuxguitar-tg-corrected-source-gate-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  SOURCE_SHA: b3a8d229aee832a7f6ea994dfc7465ff07d608c3

jobs:
  verify:
    name: Verify corrected TuxGuitar producer evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact corrected source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0

      - name: Verify source and lineage authority
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "work/tuxguitar-tg-intake-investigation"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git merge-base --is-ancestor 10a0d7f40eedf701d55e519b8a311c1816d4e077 HEAD
          test -f docs/tuxguitar-tg-producer-source-correction-2026-08-11.md
          grep -q '2c46e2a1cccdfdfa6e6f2692f241bd60bf418129' docs/tuxguitar-tg-producer-source-correction-2026-08-11.md

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Verify corrected TuxGuitar fixture evidence
        run: node scripts/verify-tuxguitar-tg-proofs.mjs

      - name: Regenerate TuxGuitar fixtures to a fixed point
        shell: bash
        run: |
          set -euo pipefail
          node scripts/generate-tuxguitar-tg-proofs.mjs
          git diff --exit-code -- fixtures/tuxguitar-tg

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Run corrected TuxGuitar and shared-routing tests
        env:
          CI: "true"
        run: |
          npm test -- --watchAll=false --runInBand \
            src/tuxGuitarCompatibility.test.js \
            src/structuredTabReaderDocuments.test.js \
            src/tabFormatDetector.test.js \
            src/App.sharedCore.test.js \
            src/App.convergence.test.js

      - name: Run complete inherited suite
        env:
          CI: "true"
        run: npm test -- --watchAll=false --runInBand

      - name: Build production application
        run: npm run build

      - name: Inspect corrected production artifact boundary
        shell: bash
        run: |
          set -euo pipefail
          test -d build
          if grep -R -a -l -E 'tuxguitar-(10|11|12|13|15|20)-six-position|Guitar Eyes TG Proof' build; then
            echo 'TuxGuitar fixture content leaked into the production artifact.' >&2
            exit 1
          fi
          grep -R -a -q 'TUXGUITAR_LEGACY_BINARY' build/static/js
          grep -R -a -q 'TUXGUITAR_ZIP_XML' build/static/js
          grep -R -a -q 'TuxGuitar_file_format 2.0.0' build/static/js
          grep -R -a -q '2c46e2a1cccdfdfa6e6f2692f241bd60bf418129' build/static/js
          grep -R -a -q '2882880' build/static/js
          echo "build_files=$(find build -type f | wc -l)"
          echo "build_bytes=$(du -sb build | cut -f1)"

      - name: Verify source checkout remained read-only
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          test -z "$(git status --porcelain)"
