name: PowerTab v11 editor parity verification

on:
  workflow_dispatch:
  push:
    branches:
      - work/powertab-pt2-v11-editor-evidence-gate
    paths:
      - .github/powertab-editor-evidence-trigger

concurrency:
  group: powertab-v11-editor-parity-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify exact editor export and complete application
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    env:
      EVIDENCE_DIR: ${{ github.workspace }}/powertab-editor-parity-evidence
      EDITOR_FILE: ${{ github.workspace }}/fixtures/powertab-v11/powertab-v11-editor-export-six-position.pt2
      EDITOR_BASE64: ${{ github.workspace }}/fixtures/powertab-v11/powertab-v11-editor-export-six-position.pt2.base64
      EDITOR_JSON: ${{ github.workspace }}/fixtures/powertab-v11/powertab-v11-editor-export-six-position.json
      EDITOR_COMPARISON: ${{ github.workspace }}/fixtures/powertab-v11/powertab-v11-editor-export-six-position.comparison.json
      MANIFEST: ${{ github.workspace }}/fixtures/powertab-v11/manifest.json
      SOURCE_BASE: 6c17997eba96e16aa248d8fd5a0e632ba5f370ce
      ACCEPTED_APPLICATION_SOURCE: 2a8e5951ec4ced3ce63b2df85d82e54c0ba79ea0
      FORK_MAIN_AUTHORITY: 60c2e5de0887b1bcdd426d932632946edd07d3c3

    steps:
      - name: Check out exact triggering source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare evidence directory
        run: |
          mkdir -p "$EVIDENCE_DIR"
          printf '%s\n' "$GITHUB_SHA" > "$EVIDENCE_DIR/triggering-commit.txt"
          env | sort > "$EVIDENCE_DIR/runner-environment.txt"
          uname -a > "$EVIDENCE_DIR/uname.txt"

      - name: Confirm authority and canonical editor evidence
        id: authority
        run: |
          set +e
          python3 - <<'PY' > "$EVIDENCE_DIR/authority-and-fixture.log" 2>&1
          import base64
          import gzip
          import hashlib
          import json
          import os
          import pathlib
          import subprocess

          def git(*args):
              return subprocess.check_output(["git", *args], text=True).strip()

          expected_branch = "work/powertab-pt2-v11-editor-evidence-gate"
          actual_branch = os.environ.get("GITHUB_REF_NAME")
          assert actual_branch == expected_branch, (
              f"branch mismatch: expected {expected_branch!r}, actual {actual_branch!r}"
          )
          source_base = os.environ["SOURCE_BASE"]
          accepted = os.environ["ACCEPTED_APPLICATION_SOURCE"]
          subprocess.run(["git", "merge-base", "--is-ancestor", accepted, "HEAD"], check=True)
          subprocess.run(["git", "merge-base", "--is-ancestor", source_base, "HEAD"], check=True)

          expected_files = {
              ".github/powertab-editor-evidence-trigger",
              ".github/workflows/powertab-pt2-v11-editor-parity.yml",
              "docs/known-problems-register-addendum-powertab-source-evidence.md",
              "docs/powertab-pt2-v11-editor-evidence-gate-result-2026-08-05.md",
              "docs/powertab-pt2-v11-hosted-producer-execution-preflight-2026-08-05.md",
              "docs/powertab-pt2-v11-hosted-producer-run-1-failure-2026-08-05.md",
              "docs/powertab-pt2-v11-hosted-producer-run-2-failure-2026-08-05.md",
              "docs/powertab-pt2-v11-hosted-producer-run-3-timeout-2026-08-05.md",
              "docs/powertab-pt2-v11-hosted-producer-run-4-gui-blocker-2026-08-05.md",
              "docs/powertab-pt2-v11-hosted-producer-run-5-result-2026-08-05.md",
              "docs/powertab-pt2-v11-hosted-producer-run-5-semantic-harness-failure-2026-08-05.md",
              "fixtures/powertab-v11/manifest.json",
              "fixtures/powertab-v11/powertab-v11-editor-export-six-position.comparison.json",
              "fixtures/powertab-v11/powertab-v11-editor-export-six-position.json",
              "fixtures/powertab-v11/powertab-v11-editor-export-six-position.pt2",
              "fixtures/powertab-v11/powertab-v11-editor-export-six-position.pt2.base64",
              "src/powerTabV11EditorExport.test.js",
              "src/powerTabV11PositionParser.js",
          }
          actual_files = set(filter(None, git("diff", "--name-only", f"{source_base}..HEAD").splitlines()))
          assert actual_files == expected_files, (
              "changed-file boundary mismatch\n"
              f"expected: {sorted(expected_files)}\n"
              f"actual:   {sorted(actual_files)}"
          )

          binary = pathlib.Path(os.environ["EDITOR_FILE"]).read_bytes()
          binary_hash = hashlib.sha256(binary).hexdigest()
          assert len(binary) == 973, f"editor binary bytes: expected 973, actual {len(binary)}"
          assert binary_hash == "6494d78b001a43322362d962b21ce88029f3c7c4cf231b9e8da5af2a3bf85835"
          mirror = base64.b64decode(
              pathlib.Path(os.environ["EDITOR_BASE64"]).read_text(encoding="utf-8").strip(),
              validate=True,
          )
          assert mirror == binary, "base64 mirror does not reproduce the editor binary"

          decompressed = gzip.decompress(binary)
          decompressed_hash = hashlib.sha256(decompressed).hexdigest()
          assert len(decompressed) == 3651, f"editor JSON bytes: expected 3651, actual {len(decompressed)}"
          assert decompressed_hash == "c5082b9f7dec3401b74373b037ae7fb438f77e2db86f85c10322f6313d52f5bd"
          assert pathlib.Path(os.environ["EDITOR_JSON"]).read_bytes() == decompressed
          document = json.loads(decompressed.decode("utf-8"))
          assert document["version"] == 11 and document["score"]["version"] == 11

          comparison = json.loads(pathlib.Path(os.environ["EDITOR_COMPARISON"]).read_text(encoding="utf-8"))
          assert comparison["differenceCount"] == 12
          assert comparison["editor"]["compressedSha256"] == binary_hash
          assert comparison["editor"]["decompressedSha256"] == decompressed_hash

          manifest = json.loads(pathlib.Path(os.environ["MANIFEST"]).read_text(encoding="utf-8"))
          assert manifest["schemaVersion"] == 2
          assert manifest["supportState"] == "editor-export-confirmed-parser-parity-pending"
          assert manifest["provenance"]["upstreamRelease"] == "2.0.22"
          assert manifest["provenance"]["upstreamCommit"] == "13cab27c7127d301f2747671071e53eb203dc940"
          assert manifest["provenance"]["editorExport"]["workflowRun"] == 31037072445
          assert manifest["files"]["editorBinary"]["sha256"] == binary_hash

          expected_trigger = "PowerTab v11 editor parity run 6 on 2026-08-05.\n"
          trigger = pathlib.Path(".github/powertab-editor-evidence-trigger").read_text(encoding="utf-8")
          assert trigger == expected_trigger, (
              f"trigger mismatch: expected {expected_trigger!r}, actual {trigger!r}"
          )

          remote_main = git("ls-remote", "origin", "refs/heads/main").split()[0]
          assert remote_main == os.environ["FORK_MAIN_AUTHORITY"], (
              f"fork main mismatch: expected {os.environ['FORK_MAIN_AUTHORITY']}, actual {remote_main}"
          )

          print(f"branch: {actual_branch}")
          print(f"head: {git('rev-parse', 'HEAD')}")
          print(f"source base: {source_base}")
          print(f"accepted application ancestor: {accepted}")
          print(f"fork main: {remote_main}")
          print(f"editor binary SHA-256: {binary_hash}")
          print(f"editor JSON SHA-256: {decompressed_hash}")
          print("changed files:")
          for path in sorted(actual_files):
              print(f"- {path}")
          PY
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Install locked project dependencies
        id: install
        if: steps.authority.outputs.exit_code == '0'
        run: |
          set +e
          npm ci --no-audit --no-fund > "$EVIDENCE_DIR/npm-install.log" 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Run focused editor parity tests
        id: focused
        if: steps.authority.outputs.exit_code == '0' && steps.install.outputs.exit_code == '0'
        run: |
          set +e
          CI=true npm test -- --watchAll=false --runInBand --runTestsByPath \
            src/powerTabV11EditorExport.test.js \
            src/powerTabV11Decoder.test.js \
            > "$EVIDENCE_DIR/focused-test.log" 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Run complete inherited suite
        id: tests
        if: steps.authority.outputs.exit_code == '0' && steps.install.outputs.exit_code == '0' && steps.focused.outputs.exit_code == '0'
        run: |
          set +e
          CI=true npm test -- --watchAll=false --runInBand > "$EVIDENCE_DIR/full-test.log" 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Build optimized application
        id: build
        if: steps.authority.outputs.exit_code == '0' && steps.install.outputs.exit_code == '0' && steps.focused.outputs.exit_code == '0' && steps.tests.outputs.exit_code == '0'
        run: |
          set +e
          npm run build > "$EVIDENCE_DIR/production-build.log" 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Inspect build and asset boundary
        id: assets
        if: steps.authority.outputs.exit_code == '0' && steps.install.outputs.exit_code == '0' && steps.focused.outputs.exit_code == '0' && steps.tests.outputs.exit_code == '0' && steps.build.outputs.exit_code == '0'
        run: |
          set +e
          python3 - <<'PY' > "$EVIDENCE_DIR/build-asset-inspection.txt" 2>&1
          import hashlib
          import pathlib

          build = pathlib.Path("build")
          assert build.is_dir(), "build directory is absent"
          forbidden = []
          files = []
          for path in sorted(p for p in build.rglob("*") if p.is_file()):
              relative = path.relative_to(build).as_posix()
              data = path.read_bytes()
              files.append((relative, len(data), hashlib.sha256(data).hexdigest()))
              if path.suffix.lower() in {".dll", ".exe", ".sf2", ".sf3", ".wav", ".mp3"} or "powertabeditor" in relative.lower():
                  forbidden.append(relative)
          assert not forbidden, f"forbidden built assets: {forbidden}"
          print(f"file count: {len(files)}")
          print(f"total bytes: {sum(size for _, size, _ in files)}")
          for relative, size, digest in files:
              print(f"{digest}  {size:>10}  {relative}")
          PY
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Write verification summary
        if: always()
        run: |
          cat > "$EVIDENCE_DIR/checkpoint-summary.txt" <<SUMMARY
          triggering_commit=$GITHUB_SHA
          authority_exit=${{ steps.authority.outputs.exit_code }}
          npm_install_exit=${{ steps.install.outputs.exit_code }}
          focused_tests_exit=${{ steps.focused.outputs.exit_code }}
          full_tests_exit=${{ steps.tests.outputs.exit_code }}
          build_exit=${{ steps.build.outputs.exit_code }}
          assets_exit=${{ steps.assets.outputs.exit_code }}
          SUMMARY

      - name: Upload bounded verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: powertab-v11-editor-parity-${{ github.run_id }}
          path: ${{ env.EVIDENCE_DIR }}
          if-no-files-found: error
          retention-days: 1
          compression-level: 6

      - name: Enforce editor parity checkpoint
        if: always()
        run: |
          test "${{ steps.authority.outputs.exit_code }}" = "0"
          test "${{ steps.install.outputs.exit_code }}" = "0"
          test "${{ steps.focused.outputs.exit_code }}" = "0"
          test "${{ steps.tests.outputs.exit_code }}" = "0"
          test "${{ steps.build.outputs.exit_code }}" = "0"
          test "${{ steps.assets.outputs.exit_code }}" = "0"
