name: iPhone extension verification

on:
  push:
    branches:
      - work/tuxguitar-standard-bass-profile
    paths:
      - .github/workflows/iphone-audit.yml
  workflow_dispatch:

concurrency:
  group: tuxguitar-standard-bass-source-gate
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify TuxGuitar standard bass source
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact application source
        uses: actions/checkout@v4
        with:
          ref: 6e60691d9870d0cf64a3f0445c12d18fb71627e3
          fetch-depth: 0

      - name: Confirm exact authority and bounded source diff
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "6e60691d9870d0cf64a3f0445c12d18fb71627e3"
          git merge-base --is-ancestor 4ce6a7502ab1c478b90e11879491021a0dcfb774 HEAD
          test -z "$(git diff --name-only 4ce6a7502ab1c478b90e11879491021a0dcfb774..HEAD -- package.json package-lock.json yarn.lock)"
          test -z "$(git diff --name-only 4ce6a7502ab1c478b90e11879491021a0dcfb774..HEAD -- fixtures/tuxguitar-tg)"
          test -z "$(git diff --name-only 4ce6a7502ab1c478b90e11879491021a0dcfb774..HEAD -- src/tuxGuitarDecoder.js src/tuxGuitarDecoderProvisional.js src/tuxGuitarSourceNormalizer.js src/tuxGuitarTrackInventory.js)"
          changed="$(git diff --name-only 4ce6a7502ab1c478b90e11879491021a0dcfb774..HEAD)"
          printf '%s\n' "$changed"
          printf '%s\n' "$changed" | grep -qx 'src/tuxGuitarReaderDocuments.js'
          printf '%s\n' "$changed" | grep -qx 'src/tuxGuitarBassCompatibility.test.js'
          printf '%s\n' "$changed" | grep -qx 'fixtures/tuxguitar-tg-bass/tuxguitar-20-standard-bass.tg'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install locked dependencies
        shell: bash
        run: npm ci --no-audit --no-fund

      - name: Prove deterministic bass corpus reaches a fixed point
        shell: bash
        run: |
          set -euo pipefail
          node scripts/generate-tuxguitar-tg-bass-proofs.mjs
          git diff --exit-code -- fixtures/tuxguitar-tg-bass
          find fixtures/tuxguitar-tg-bass -maxdepth 1 -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/bass-hashes-1.txt
          node scripts/generate-tuxguitar-tg-bass-proofs.mjs
          git diff --exit-code -- fixtures/tuxguitar-tg-bass
          find fixtures/tuxguitar-tg-bass -maxdepth 1 -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/bass-hashes-2.txt
          diff -u /tmp/bass-hashes-1.txt /tmp/bass-hashes-2.txt
          node scripts/verify-tuxguitar-tg-bass-proofs.mjs

      - name: Run focused TuxGuitar guitar and bass proof
        shell: bash
        run: CI=true npm test -- --watchAll=false --runTestsByPath src/tuxGuitarCompatibility.test.js src/tuxGuitarBassCompatibility.test.js

      - name: Run complete inherited suite
        shell: bash
        run: CI=true npm test -- --watchAll=false

      - name: Build production application
        shell: bash
        run: npm run build

      - name: Inspect feature and asset boundary
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git diff --name-only 4ce6a7502ab1c478b90e11879491021a0dcfb774..HEAD -- public package.json package-lock.json)"
          feature_files=(
            src/tuxGuitarProfileDecoder.js
            src/tuxGuitarStandardBassAdapter.js
            src/tuxGuitarStandardBassLegacy.js
            src/tuxGuitarStandardBassModern.js
            src/tuxGuitarStandardBassShared.js
            src/tuxGuitarStandardBassZip.js
            src/tuxGuitarReaderDocuments.js
          )
          if grep -Ein 'AudioContext|AudioWorklet|alphaSynth|soundfont|\.sf2|\.mp3|\.wav|new Worker|fetch\(' "${feature_files[@]}"; then
            echo 'Unexpected playback, worker, network, or audio machinery in the bounded bass source.' >&2
            exit 1
          fi
          test -f build/index.html
          test -n "$(find build/static/js -type f -name '*.js' -print -quit)"

      - name: Upload short-retention source-gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tuxguitar-standard-bass-source-gate
          retention-days: 1
          path: |
            /tmp/bass-hashes-1.txt
            /tmp/bass-hashes-2.txt
