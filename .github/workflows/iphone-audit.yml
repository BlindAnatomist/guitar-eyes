name: Guitar Eyes convergence verification

on:
  workflow_dispatch:

concurrency:
  group: guitar-eyes-convergence-verification-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Test and build semantic convergence checkpoint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out requested source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install locked dependencies
        id: install
        continue-on-error: true
        run: npm ci --no-audit --no-fund

      - name: Run the complete automated test suite once
        id: test
        if: steps.install.outcome == 'success'
        continue-on-error: true
        env:
          CI: true
        run: npm test -- --watchAll=false

      - name: Build the production application
        id: build
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: npm run build

      - name: Record checkpoint summary
        if: always()
        shell: bash
        run: |
          {
            echo '# Guitar Eyes convergence verification'
            echo
            echo "Source commit: \`$GITHUB_SHA\`"
            echo
            echo "- npm ci outcome: \`${{ steps.install.outcome }}\`"
            echo "- automated test outcome: \`${{ steps.test.outcome }}\`"
            echo "- production build outcome: \`${{ steps.build.outcome }}\`"
            echo
            echo 'This workflow is an intentional checkpoint. It does not commit results or modify repository branches.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Enforce checkpoint result
        if: always()
        shell: bash
        run: |
          if [ "${{ steps.install.outcome }}" != "success" ] || \
             [ "${{ steps.test.outcome }}" != "success" ] || \
             [ "${{ steps.build.outcome }}" != "success" ]; then
            exit 1
          fi
