name: TuxGuitar bass verification exception

on:
  push:
    branches:
      - work/tuxguitar-standard-bass-profile
    paths:
      - .github/workflows/iphone-audit.yml

concurrency:
  group: tuxguitar-standard-bass-authorized-exception
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify repaired TuxGuitar bass candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact repaired candidate
        uses: actions/checkout@v4
        with:
          ref: 461c63c3f36f78d9e356442506441f68efd5be71

      - name: Confirm exact candidate
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          expected="461c63c3f36f78d9e356442506441f68efd5be71"
          printf 'expected=%s\nactual=%s\n' "$expected" "$actual"
          test "$actual" = "$expected"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install locked dependencies
        shell: bash
        run: npm ci --no-audit --no-fund

      - name: Run focused TuxGuitar guitar and bass proof
        shell: bash
        run: CI=true npm test -- --watchAll=false --runTestsByPath src/tuxGuitarCompatibility.test.js src/tuxGuitarBassCompatibility.test.js

      - name: Run complete inherited suite
        shell: bash
        run: CI=true npm test -- --watchAll=false

      - name: Build production application
        shell: bash
        run: npm run build

      - name: Inspect bounded feature and production asset
        shell: bash
        run: |
          set -euo pipefail
          feature_files=(
            src/tuxGuitarProfileDecoder.js
            src/tuxGuitarStandardBassAdapter.js
            src/tuxGuitarStandardBassLegacy.js
            src/tuxGuitarStandardBassModern.js
            src/tuxGuitarStandardBassShared.js
            src/tuxGuitarStandardBassZip.js
            src/tuxGuitarReaderDocuments.js
          )
          if grep -Ein 'AudioContext|AudioWorklet|alphaSynth|soundfont|\.sf2|\.mp3|\.wav|new Worker|fetch\(' "${feature_files[@]}"; then
            echo 'Unexpected playback, worker, network, or audio machinery in the bounded bass source.' >&2
            exit 1
          fi
          test -f build/index.html
          test -n "$(find build/static/js -type f -name '*.js' -print -quit)"

      - name: Record compact verification evidence
        if: always()
        shell: bash
        run: |
          {
            echo 'candidate=461c63c3f36f78d9e356442506441f68efd5be71'
            echo "node=$(node --version 2>/dev/null || true)"
            echo "npm=$(npm --version 2>/dev/null || true)"
          } > /tmp/tuxguitar-bass-exception-evidence.txt

      - name: Upload short-retention evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tuxguitar-standard-bass-authorized-exception
          retention-days: 1
          path: /tmp/tuxguitar-bass-exception-evidence.txt
