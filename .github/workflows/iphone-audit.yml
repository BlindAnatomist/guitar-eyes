name: iPhone extension verification

on:
  workflow_dispatch:
  push:
    branches:
      - work/powertab-standard-bass-profile

concurrency:
  group: iphone-extension-verification-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  verify:
    name: Test and build bounded iPhone proof
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out requested source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install locked dependencies
        id: install
        shell: bash
        run: |
          set +e
          npm ci --no-audit --no-fund > install.log 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Run automated tests once
        id: test
        shell: bash
        run: |
          set +e
          if [ "${{ steps.install.outputs.exit_code }}" = "0" ]; then
            CI=true npm test -- --watchAll=false > test.log 2>&1
            code=$?
          else
            printf '%s\n' 'Skipped because npm ci failed.' > test.log
            code=125
          fi
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Build production application
        id: build
        shell: bash
        run: |
          set +e
          if [ "${{ steps.install.outputs.exit_code }}" = "0" ]; then
            npm run build > build.log 2>&1
            code=$?
          else
            printf '%s\n' 'Skipped because npm ci failed.' > build.log
            code=125
          fi
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Write repository verification result
        shell: bash
        run: |
          mkdir -p docs
          {
            echo '# Bounded iPhone Proof Automated Results'
            echo
            echo "Generated from audit-branch commit: \`$GITHUB_SHA\`"
            echo
            echo "Node version: \`$(node --version)\`"
            echo
            echo "npm version: \`$(npm --version)\`"
            echo
            echo '## Result summary'
            echo
            echo "- npm ci exit code: \`${{ steps.install.outputs.exit_code }}\`"
            echo "- automated test exit code: \`${{ steps.test.outputs.exit_code }}\`"
            echo "- production build exit code: \`${{ steps.build.outputs.exit_code }}\`"
            echo
            echo 'Exit code 0 means success. Exit code 125 means the command was skipped because installation failed.'
            echo
            echo '## npm ci log'
            echo
            tail -n 120 install.log | sed 's/^/    /'
            echo
            echo '## Automated test log'
            echo
            tail -n 200 test.log | sed 's/^/    /'
            echo
            echo '## Production build log'
            echo
            tail -n 160 build.log | sed 's/^/    /'
          } > docs/proof-automated-results.md

      - name: Commit verification result to audit branch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/proof-automated-results.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'docs: record intentional proof checkpoint [skip ci]'
          git push

      - name: Enforce verification result
        shell: bash
        run: |
          if [ "${{ steps.install.outputs.exit_code }}" != "0" ] || \
             [ "${{ steps.test.outputs.exit_code }}" != "0" ] || \
             [ "${{ steps.build.outputs.exit_code }}" != "0" ]; then
            exit 1
          fi
