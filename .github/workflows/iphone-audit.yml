name: iPhone extension baseline audit

on:
  push:
    branches:
      - work/iphone-voiceover-tablature-audit
    paths-ignore:
      - docs/baseline-automated-results.md

permissions:
  contents: write

jobs:
  baseline:
    name: Record baseline install, build, and test results
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install locked dependencies
        id: install
        shell: bash
        run: |
          set +e
          npm ci > install.log 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Build untouched application
        id: build
        shell: bash
        run: |
          set +e
          if [ "${{ steps.install.outputs.exit_code }}" = "0" ]; then
            npm run build > build.log 2>&1
            code=$?
          else
            printf '%s\n' 'Skipped because npm ci failed.' > build.log
            code=125
          fi
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Run existing tests once
        id: test
        shell: bash
        run: |
          set +e
          if [ "${{ steps.install.outputs.exit_code }}" = "0" ]; then
            CI=true npm test -- --watchAll=false > test.log 2>&1
            code=$?
          else
            printf '%s\n' 'Skipped because npm ci failed.' > test.log
            code=125
          fi
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Write repository audit result
        shell: bash
        run: |
          mkdir -p docs
          {
            echo '# Baseline Automated Audit Results'
            echo
            echo "Generated from audit-branch commit: \`$GITHUB_SHA\`"
            echo
            echo "Node version: \`$(node --version)\`"
            echo
            echo "npm version: \`$(npm --version)\`"
            echo
            echo '## Result summary'
            echo
            echo "- npm ci exit code: \`${{ steps.install.outputs.exit_code }}\`"
            echo "- npm run build exit code: \`${{ steps.build.outputs.exit_code }}\`"
            echo "- existing test command exit code: \`${{ steps.test.outputs.exit_code }}\`"
            echo
            echo 'Exit code 0 means success. Exit code 125 means the command was skipped because installation failed.'
            echo
            echo '## npm ci log'
            echo
            tail -n 160 install.log | sed 's/^/    /'
            echo
            echo '## Production build log'
            echo
            tail -n 160 build.log | sed 's/^/    /'
            echo
            echo '## Existing test log'
            echo
            tail -n 160 test.log | sed 's/^/    /'
          } > docs/baseline-automated-results.md

      - name: Commit audit result to the audit branch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/baseline-automated-results.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'docs: record baseline automation results [skip ci]'
          git push
