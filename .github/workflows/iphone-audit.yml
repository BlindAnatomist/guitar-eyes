name: iPhone extension baseline audit

on:
  push:
    branches:
      - work/iphone-voiceover-tablature-audit

permissions:
  contents: read

jobs:
  build:
    name: Baseline production build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Build untouched application
        run: npm run build

  test:
    name: Baseline automated tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run existing tests once
        run: npm test -- --watchAll=false
