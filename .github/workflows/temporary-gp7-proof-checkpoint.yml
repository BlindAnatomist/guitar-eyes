name: Temporary Guitar Pro 7 artifact completion

on:
  push:
    branches:
      - work/tablature-intake-expansion

concurrency:
  group: temporary-guitar-pro-7-proof
  cancel-in-progress: true

permissions:
  contents: write
  statuses: write

jobs:
  verify:
    if: github.event.head_commit.message != 'Generate deterministic GP7 proof artifacts [generated-gp7]'
    name: Commit exact artifacts after passed proof gates
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out checkpoint branch
        uses: actions/checkout@v4
        with:
          ref: work/tablature-intake-expansion
          fetch-depth: 0

      - name: Confirm passed proof ancestry and clean checkout
        run: |
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          git merge-base --is-ancestor 10e9690fe197a68ee563aaeb70e8e62fdf57d174 HEAD
          test -z "$(git status --short)"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install exact dependency and regenerate proof artifacts
        env:
          npm_config_cache: /tmp/guitar-eyes-gp7-npm-cache
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm run generate:gp7-proof | tee /tmp/gp7-generation.json
          (cd fixtures/real-world && sha256sum -c guitar-pro-7-proof.gp.sha256)

      - name: Record and enforce exact changed paths
        shell: python
        run: |
          from pathlib import Path
          import json
          import subprocess

          expected = {
              'package-lock.json',
              'fixtures/real-world/guitar-pro-7-proof.gp',
              'fixtures/real-world/guitar-pro-7-proof.gp.sha256',
          }
          raw = subprocess.check_output(
              ['git', 'status', '--porcelain=v1', '--untracked-files=all'],
              text=True,
          )
          entries = []
          for line in raw.splitlines():
              if len(line) < 4:
                  raise AssertionError(f'unexpected porcelain status line: {line!r}')
              status = line[:2]
              path = line[3:]
              entries.append({'status': status, 'path': path})

          changed = {entry['path'] for entry in entries}
          report = {
              'preserved_test_run': 30234224820,
              'preserved_tests': '153 of 153',
              'preserved_build_and_inspection_run': 30234376891,
              'changed_entries': entries,
              'expected_paths': sorted(expected),
              'unexpected_paths': sorted(changed - expected),
              'missing_paths': sorted(expected - changed),
          }
          Path('/tmp/gp7-status-report.json').write_text(
              json.dumps(report, indent=2, sort_keys=True),
              encoding='utf-8',
          )
          print(json.dumps(report, indent=2, sort_keys=True))

          assert entries, 'no generated changes were present'
          assert changed == expected, report

      - name: Upload exact status report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gp7-proof-status-report
          path: |
            /tmp/gp7-status-report.json
            /tmp/gp7-generation.json
          if-no-files-found: error
          retention-days: 1

      - name: Commit deterministic proof artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json fixtures/real-world/guitar-pro-7-proof.gp fixtures/real-world/guitar-pro-7-proof.gp.sha256
          git commit -m 'Generate deterministic GP7 proof artifacts [generated-gp7]'
          git push origin HEAD:work/tablature-intake-expansion
          echo "GENERATED_COMMIT=$(git rev-parse HEAD)"

      - name: Record success status
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body -sS \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "{\"state\":\"success\",\"context\":\"guitar-eyes/gp7-artifacts\",\"description\":\"Exact lockfile and deterministic GP7 artifacts committed\",\"target_url\":\"https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}"

      - name: Record failure status
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body -sS \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "{\"state\":\"failure\",\"context\":\"guitar-eyes/gp7-artifacts\",\"description\":\"Exact changed-path report uploaded for inspection\",\"target_url\":\"https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}"
