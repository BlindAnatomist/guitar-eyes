name: PowerTab v11 editor parity closure

on:
  workflow_dispatch:
  push:
    branches:
      - work/powertab-pt2-v11-editor-parity
    paths:
      - .github/powertab-editor-parity-trigger

concurrency:
  group: powertab-v11-editor-parity-closure-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  closure:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      EVIDENCE_DIR: ${{ github.workspace }}/powertab-parity-evidence
      EVIDENCE_BASE: 38e4ce878ea0607051084e631e6384b9c0e7008f
      ACCEPTED_APPLICATION_SOURCE: 2a8e5951ec4ced3ce63b2df85d82e54c0ba79ea0
      FORK_MAIN_AUTHORITY: 60c2e5de0887b1bcdd426d932632946edd07d3c3
      EDITOR_BINARY_SHA256: 6494d78b001a43322362d962b21ce88029f3c7c4cf231b9e8da5af2a3bf85835
      EDITOR_JSON_SHA256: c5082b9f7dec3401b74373b037ae7fb438f77e2db86f85c10322f6313d52f5bd

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare evidence
        run: |
          mkdir -p "$EVIDENCE_DIR"
          printf '%s\n' "$GITHUB_SHA" > "$EVIDENCE_DIR/triggering-commit.txt"
          env | sort > "$EVIDENCE_DIR/runner-environment.txt"
          uname -a > "$EVIDENCE_DIR/uname.txt"

      - name: Confirm closure authority
        id: authority
        run: |
          set +e
          python3 - <<'PY' > "$EVIDENCE_DIR/authority-and-fixture.log" 2>&1
          import base64, gzip, hashlib, json, os, pathlib, subprocess
          def git(*args):
              return subprocess.check_output(["git", *args], text=True).strip()
          assert os.environ.get("GITHUB_REF_NAME") == "work/powertab-pt2-v11-editor-parity"
          base = os.environ["EVIDENCE_BASE"]
          subprocess.run(["git", "merge-base", "--is-ancestor", base, "HEAD"], check=True)
          subprocess.run(["git", "merge-base", "--is-ancestor", os.environ["ACCEPTED_APPLICATION_SOURCE"], "HEAD"], check=True)
          expected = {
              ".github/powertab-editor-parity-trigger",
              ".github/workflows/powertab-pt2-v11-parity-closure.yml",
              "fixtures/powertab-v11/manifest.json",
              "fixtures/powertab-v11/powertab-v11-editor-export-six-position.json",
              "src/App.test.js",
              "src/powerTabSourceNormalizer.js",
              "src/powerTabV11Decoder.test.js",
              "src/powerTabV11PositionParser.js",
              "src/powerTabV11Schema.js",
              "src/powerTabV11SystemStructure.js",
          }
          actual = set(filter(None, git("diff", "--name-only", f"{base}..HEAD").splitlines()))
          assert actual == expected, f"changed-file mismatch\nexpected={sorted(expected)}\nactual={sorted(actual)}"
          trigger = pathlib.Path(".github/powertab-editor-parity-trigger").read_text(encoding="utf-8")
          assert trigger == "PowerTab v11 editor parity gate: promoted closure run 6 on 2026-08-05.\n"
          main = git("ls-remote", "origin", "refs/heads/main").split()[0]
          assert main == os.environ["FORK_MAIN_AUTHORITY"]
          binary = pathlib.Path("fixtures/powertab-v11/powertab-v11-editor-export-six-position.pt2").read_bytes()
          raw = gzip.decompress(binary)
          audit = pathlib.Path("fixtures/powertab-v11/powertab-v11-editor-export-six-position.json").read_bytes()
          mirror = base64.b64decode(pathlib.Path("fixtures/powertab-v11/powertab-v11-editor-export-six-position.pt2.base64").read_text().strip())
          assert hashlib.sha256(binary).hexdigest() == os.environ["EDITOR_BINARY_SHA256"]
          assert hashlib.sha256(raw).hexdigest() == os.environ["EDITOR_JSON_SHA256"]
          assert raw == audit and mirror == binary
          manifest = json.loads(pathlib.Path("fixtures/powertab-v11/manifest.json").read_text())
          assert manifest["supportState"] == "editor-export-parity-verified"
          parity = manifest["provenance"]["parityVerification"]
          assert parity["workflowRun"] == 31040496589
          assert parity["fullSuites"] == 53 and parity["fullTests"] == 328
          assert parity["optimizedBuild"] == "passed"
          forbidden = [
              ".github/powertab-producer-gate.sh",
              ".github/powertab-structural-compare.py",
              ".github/powertab-editor-semantic-gate.test.js",
              ".github/powertab-editor-evidence-trigger",
              ".github/workflows/powertab-pt2-v11-producer-gate-v4.yml",
              ".github/workflows/powertab-pt2-v11-parity-gate-v5.yml",
          ]
          present = [p for p in forbidden if pathlib.Path(p).exists()]
          assert not present, present
          print(f"head={git('rev-parse', 'HEAD')}")
          print(f"fork_main={main}")
          print(f"support_state={manifest['supportState']}")
          print(f"editor_binary_sha256={hashlib.sha256(binary).hexdigest()}")
          print("changed_files:")
          for p in sorted(actual): print(f"- {p}")
          PY
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Install locked dependencies
        id: install
        if: steps.authority.outputs.exit_code == '0'
        run: |
          set +e
          npm ci --no-audit --no-fund > "$EVIDENCE_DIR/npm-install.log" 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Run focused closure tests
        id: focused
        if: steps.authority.outputs.exit_code == '0' && steps.install.outputs.exit_code == '0'
        run: |
          set +e
          CI=true npm test -- --watchAll=false --runInBand --runTestsByPath \
            src/powerTabV11Decoder.test.js \
            src/powerTabSourceNormalizer.test.js \
            src/App.test.js \
            > "$EVIDENCE_DIR/focused-test.log" 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Run complete inherited suite
        id: tests
        if: steps.authority.outputs.exit_code == '0' && steps.install.outputs.exit_code == '0' && steps.focused.outputs.exit_code == '0'
        run: |
          set +e
          CI=true npm test -- --watchAll=false --runInBand > "$EVIDENCE_DIR/full-test.log" 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Build optimized application
        id: build
        if: steps.authority.outputs.exit_code == '0' && steps.install.outputs.exit_code == '0' && steps.focused.outputs.exit_code == '0' && steps.tests.outputs.exit_code == '0'
        run: |
          set +e
          npm run build > "$EVIDENCE_DIR/production-build.log" 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Inspect bundle and tracked checkout
        id: assets
        if: steps.authority.outputs.exit_code == '0' && steps.install.outputs.exit_code == '0' && steps.focused.outputs.exit_code == '0' && steps.tests.outputs.exit_code == '0' && steps.build.outputs.exit_code == '0'
        run: |
          set +e
          python3 - <<'PY' > "$EVIDENCE_DIR/build-asset-inspection.txt" 2>&1
          import hashlib, pathlib, subprocess
          build = pathlib.Path("build")
          assert build.is_dir()
          forbidden, files = [], []
          for path in sorted(p for p in build.rglob("*") if p.is_file()):
              rel = path.relative_to(build).as_posix()
              data = path.read_bytes()
              files.append((rel, len(data), hashlib.sha256(data).hexdigest()))
              if path.suffix.lower() in {".dll", ".exe", ".pt2", ".sf2", ".sf3", ".wav", ".mp3"} or "powertabeditor" in rel.lower():
                  forbidden.append(rel)
          assert not forbidden, forbidden
          status = subprocess.check_output(["git", "status", "--short", "--untracked-files=no"], text=True).strip()
          assert not status, status
          print(f"file_count={len(files)}")
          print(f"total_bytes={sum(size for _, size, _ in files)}")
          for rel, size, digest in files: print(f"{digest}  {size:>10}  {rel}")
          PY
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Write closure summary
        if: always()
        run: |
          cat > "$EVIDENCE_DIR/checkpoint-summary.txt" <<SUMMARY
          triggering_commit=$GITHUB_SHA
          authority_exit=${{ steps.authority.outputs.exit_code }}
          npm_install_exit=${{ steps.install.outputs.exit_code }}
          focused_test_exit=${{ steps.focused.outputs.exit_code }}
          full_tests_exit=${{ steps.tests.outputs.exit_code }}
          build_exit=${{ steps.build.outputs.exit_code }}
          assets_exit=${{ steps.assets.outputs.exit_code }}
          SUMMARY

      - name: Upload closure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: powertab-v11-editor-parity-closure-${{ github.run_id }}
          path: ${{ env.EVIDENCE_DIR }}
          if-no-files-found: error
          retention-days: 1
          compression-level: 6

      - name: Enforce closure
        if: always()
        run: |
          test "${{ steps.authority.outputs.exit_code }}" = "0"
          test "${{ steps.install.outputs.exit_code }}" = "0"
          test "${{ steps.focused.outputs.exit_code }}" = "0"
          test "${{ steps.tests.outputs.exit_code }}" = "0"
          test "${{ steps.build.outputs.exit_code }}" = "0"
          test "${{ steps.assets.outputs.exit_code }}" = "0"
