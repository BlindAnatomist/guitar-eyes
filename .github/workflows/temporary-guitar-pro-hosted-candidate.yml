name: Temporary Guitar Pro hosted candidate

on:
  push:
    branches:
      - work/tablature-intake-expansion

concurrency:
  group: guitar-pro-hosted-candidate
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write
  statuses: write

jobs:
  deploy:
    if: github.event.head_commit.message != 'Remove temporary Guitar Pro hosted candidate workflow [hosted-candidate-cleanup]'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/tablature-intake-expansion
          fetch-depth: 0

      - name: Confirm exact verified application source
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor 1815095e8b9e669e7ca98107e6521acc1026f141 HEAD
          changed=$(git diff --name-only 1815095e8b9e669e7ca98107e6521acc1026f141..HEAD)
          test "$changed" = ".github/workflows/temporary-guitar-pro-hosted-candidate.yml"
          test -z "$(git status --short)"

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install exact dependencies
        env:
          npm_config_cache: /tmp/guitar-eyes-hosted-candidate-npm-cache
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Build Pages candidate
        env:
          CI: true
          PUBLIC_URL: /guitar-eyes
        run: npm run build | tee /tmp/hosted-candidate-build.log

      - name: Verify Pages path and candidate identity
        shell: python
        run: |
          from pathlib import Path
          import json

          html = Path('build/index.html').read_text(encoding='utf-8')
          assert '<title>Test build Guitar Pro multi-track binary proof 3D</title>' in html
          assert 'Test build: Guitar Pro multi-track binary proof 3D.' in html
          assert '/guitar-eyes/static/js/' in html
          assert '/guitar-eyes/static/css/' in html

          js_files = sorted(Path('build').rglob('*.js'))
          main = [path for path in js_files if path.name.startswith('main.')]
          assert len(main) == 1, main
          main_text = main[0].read_text(encoding='utf-8', errors='ignore')
          assert 'Choose a Guitar Pro track' in main_text
          assert 'Load selected track' in main_text
          assert 'guitar-eyes-guitar-pro-import' in '\n'.join(
              path.read_text(encoding='utf-8', errors='ignore') for path in js_files
          )
          assert 'No score.gpif found in zip archive' not in main_text
          assert 'alphaSynth' not in main_text

          report = {
              'source_commit': '1815095e8b9e669e7ca98107e6521acc1026f141',
              'trigger_commit': '${{ github.sha }}',
              'public_path': '/guitar-eyes',
              'title': 'Test build Guitar Pro multi-track binary proof 3D',
              'main_js': main[0].relative_to('build').as_posix(),
              'main_bytes': main[0].stat().st_size,
          }
          Path('/tmp/hosted-candidate-report.json').write_text(
              json.dumps(report, indent=2, sort_keys=True),
              encoding='utf-8',
          )
          print(json.dumps(report, indent=2, sort_keys=True))

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build

      - name: Deploy hosted candidate
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify published candidate
        shell: bash
        run: |
          url="${{ steps.deployment.outputs.page_url }}"
          echo "$url" | tee /tmp/hosted-candidate-url.txt
          success=0
          for attempt in 1 2 3 4 5 6; do
            if curl --fail --silent --show-error --location "$url" -o /tmp/published-index.html; then
              if grep -F '<title>Test build Guitar Pro multi-track binary proof 3D</title>' /tmp/published-index.html >/dev/null && \
                 grep -F 'Test build: Guitar Pro multi-track binary proof 3D.' /tmp/published-index.html >/dev/null; then
                success=1
                break
              fi
            fi
            sleep 10
          done
          test "$success" -eq 1
          grep -F '/guitar-eyes/static/js/' /tmp/published-index.html >/dev/null

      - name: Upload hosted candidate evidence
        uses: actions/upload-artifact@v4
        with:
          name: guitar-pro-hosted-candidate-evidence
          path: |
            /tmp/hosted-candidate-build.log
            /tmp/hosted-candidate-report.json
            /tmp/hosted-candidate-url.txt
            /tmp/published-index.html
          if-no-files-found: error
          retention-days: 1

      - name: Remove temporary deployment workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/temporary-guitar-pro-hosted-candidate.yml
          git commit -m 'Remove temporary Guitar Pro hosted candidate workflow [hosted-candidate-cleanup]'
          git push origin HEAD:work/tablature-intake-expansion

      - name: Record success status
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "{\"state\":\"success\",\"context\":\"guitar-eyes/hosted-candidate-3d\",\"description\":\"Hosted multi-track candidate deployed and verified\",\"target_url\":\"${{ steps.deployment.outputs.page_url }}\"}"

      - name: Record failure status
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "{\"state\":\"failure\",\"context\":\"guitar-eyes/hosted-candidate-3d\",\"description\":\"Inspect bounded hosted-candidate deployment failure\",\"target_url\":\"https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}"
