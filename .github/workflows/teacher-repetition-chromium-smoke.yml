name: One bounded repetition Chromium smoke

on:
  push:
    branches:
      - work/teacher-repetition-chromium-smoke-2026-10-05

permissions:
  contents: read

concurrency:
  group: teacher-repetition-chromium-smoke-2026-10-05
  cancel-in-progress: true

jobs:
  smoke:
    if: >-
      github.repository == 'BlindAnatomist/guitar-eyes' &&
      github.ref == 'refs/heads/work/teacher-repetition-chromium-smoke-2026-10-05' &&
      github.event.deleted == false &&
      contains(github.event.head_commit.message, '[repetition chromium smoke]') &&
      github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CI: 'true'
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      npm_config_fetch_retries: '0'
      npm_config_fetch_timeout: '45000'
    steps:
      - name: Check out the exact technical verification commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Verify complete reviewed artifact before installing anything
        shell: bash
        run: |
          set -euo pipefail
          printf 'PLAYWRIGHT_PREFIX=%s/teacher-playwright\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'PLAYWRIGHT_BROWSERS_PATH=%s/teacher-browsers\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/teacher-smoke-results"
          python3 technical-verification/teacher-repetition-chromium-smoke/verify-reviewed-build.py \
            "$RUNNER_TEMP/teacher-reviewed-build" "$GITHUB_WORKSPACE" \
            | tee "$RUNNER_TEMP/teacher-smoke-results/artifact-verification.json"

      - name: Set up Node.js for the isolated smoke only
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Check script syntax
        run: node --check technical-verification/teacher-repetition-chromium-smoke/smoke.mjs

      - name: Install pinned Playwright outside the application
        shell: bash
        timeout-minutes: 2
        run: |
          set -euo pipefail
          mkdir -p "$PLAYWRIGHT_PREFIX"
          npm install --prefix "$PLAYWRIGHT_PREFIX" --no-audit --no-fund \
            --ignore-scripts --no-package-lock --save-exact playwright@1.63.0

      - name: Install only official Chromium and required Linux dependencies
        shell: bash
        timeout-minutes: 5
        run: |
          set -euo pipefail
          node "$PLAYWRIGHT_PREFIX/node_modules/playwright/cli.js" install --with-deps --no-shell chromium

      - name: Run the bounded real-Chromium smoke once
        shell: bash
        timeout-minutes: 3
        run: |
          set -euo pipefail
          node technical-verification/teacher-repetition-chromium-smoke/smoke.mjs \
            "$RUNNER_TEMP/teacher-reviewed-build" \
            fixtures/teacher/pattern-and-ending.musicxml \
            fixtures/teacher/exact-repetition.musicxml \
            "$RUNNER_TEMP/teacher-smoke-results"

      - name: Preserve small technical diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: teacher-repetition-chromium-smoke-${{ github.run_id }}
          path: ${{ runner.temp }}/teacher-smoke-results/
          retention-days: 1
          if-no-files-found: warn
          compression-level: 6
