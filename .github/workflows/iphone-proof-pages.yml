name: Deploy iPhone proof to GitHub Pages

on:
  push:
    branches:
      - work/iphone-voiceover-tablature-audit
  workflow_dispatch:

concurrency:
  group: guitar-eyes-iphone-proof-pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build isolated iPhone proof
    runs-on: ubuntu-latest
    steps:
      - name: Check out audit branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Build for repository Pages path
        env:
          PUBLIC_URL: /guitar-eyes
        run: npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload proof artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: build

  deploy:
    name: Publish isolated iPhone proof
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
