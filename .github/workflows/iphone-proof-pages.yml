name: Deploy iPhone proof to GitHub Pages

on:
  push:
    branches:
      - work/iphone-voiceover-tablature-audit
    paths-ignore:
      - docs/pages-deployment-status.md
  workflow_dispatch:

concurrency:
  group: guitar-eyes-iphone-proof-pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build isolated iPhone proof
    runs-on: ubuntu-latest
    steps:
      - name: Check out audit branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Build for repository Pages path
        env:
          PUBLIC_URL: /guitar-eyes
        run: npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload proof artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: build

  deploy:
    name: Publish isolated iPhone proof
    needs: build
    runs-on: ubuntu-latest
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  record:
    name: Record hosted-preview result
    if: ${{ always() }}
    needs:
      - build
      - deploy
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Check out current audit branch
        uses: actions/checkout@v4
        with:
          ref: work/iphone-voiceover-tablature-audit

      - name: Refresh branch before recording
        run: git pull --rebase origin work/iphone-voiceover-tablature-audit

      - name: Write deployment result
        shell: bash
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          mkdir -p docs
          if [ -z "$PAGE_URL" ]; then
            PAGE_URL='Not available. GitHub Pages may still need to be enabled with GitHub Actions as its source.'
          fi
          {
            echo '# iPhone Proof Hosted Preview Status'
            echo
            echo "Source commit: \`$SOURCE_SHA\`"
            echo
            echo "Build job: \`$BUILD_RESULT\`"
            echo
            echo "Deployment job: \`$DEPLOY_RESULT\`"
            echo
            echo "Preview URL: $PAGE_URL"
            echo
            if [ "$DEPLOY_RESULT" = 'success' ]; then
              echo 'The preview is isolated under the BlindAnatomist fork. It does not publish to or modify the upstream repository.'
            else
              echo 'No hosted preview is accepted yet. A failed or skipped deployment must be resolved before real-iPhone acceptance.'
            fi
          } > docs/pages-deployment-status.md

      - name: Commit deployment result
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/pages-deployment-status.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'docs: record hosted preview status [skip ci]'
          git push
