name: Build iPhone proof for GitHub Pages

on:
  workflow_dispatch:

concurrency:
  group: guitar-eyes-iphone-proof-pages-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build isolated iPhone proof
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out requested source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Build for repository Pages path
        env:
          PUBLIC_URL: /guitar-eyes
        run: npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload proof artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: build

  deploy:
    name: Publish isolated iPhone proof
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
