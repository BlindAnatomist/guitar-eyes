name: PowerTab v11 producer evidence gate corrected

on:
  workflow_dispatch:
  push:
    branches:
      - work/powertab-pt2-v11-editor-evidence-gate
    paths:
      - .github/powertab-editor-evidence-trigger

concurrency:
  group: powertab-v11-producer-corrected-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  producer-evidence:
    name: Execute exact Power Tab Editor producer corrected
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    env:
      EVIDENCE_DIR: ${{ github.workspace }}/powertab-producer-evidence
      FIXTURE_PATH: ${{ github.workspace }}/fixtures/powertab-v11/powertab-v11-original-six-position.pt2
      EDITOR_FILE: ${{ github.workspace }}/powertab-producer-evidence/powertab-v11-editor-resaved-six-position.pt2
      SOURCE_BASE: 6c17997eba96e16aa248d8fd5a0e632ba5f370ce
      ACCEPTED_APPLICATION_SOURCE: 2a8e5951ec4ced3ce63b2df85d82e54c0ba79ea0
      FORK_MAIN_AUTHORITY: 60c2e5de0887b1bcdd426d932632946edd07d3c3
      INSTALLER_SHA256: 523f12b26b457afa1ea8b15cf0daa2dfd1d82106da723150f662d8bee6a48037
      FIXTURE_SHA256: 669f9b71e7f8ba3c9ce939b98076bbddc17fb977b63b7f647f4bd01cfa072e71

    steps:
      - name: Check out exact triggering source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare evidence directory
        shell: bash
        run: |
          mkdir -p "$EVIDENCE_DIR"
          printf '%s\n' "$GITHUB_SHA" > "$EVIDENCE_DIR/triggering-commit.txt"
          env | sort > "$EVIDENCE_DIR/runner-environment.txt"
          uname -a > "$EVIDENCE_DIR/uname.txt"

      - name: Confirm exact authority and corrected temporary boundary
        id: authority
        shell: bash
        run: |
          set +e
          python3 - <<'PY' > "$EVIDENCE_DIR/authority.log" 2>&1
          import hashlib
          import os
          import pathlib
          import subprocess

          expected_branch = "work/powertab-pt2-v11-editor-evidence-gate"
          actual_branch = os.environ.get("GITHUB_REF_NAME")
          assert actual_branch == expected_branch, (
              f"branch mismatch: expected {expected_branch!r}, actual {actual_branch!r}"
          )

          def git(*args):
              return subprocess.check_output(["git", *args], text=True).strip()

          source_base = os.environ["SOURCE_BASE"]
          accepted = os.environ["ACCEPTED_APPLICATION_SOURCE"]
          subprocess.run(["git", "merge-base", "--is-ancestor", accepted, "HEAD"], check=True)
          subprocess.run(["git", "merge-base", "--is-ancestor", source_base, "HEAD"], check=True)

          expected_files = {
              ".github/powertab-editor-evidence-trigger",
              ".github/powertab-editor-semantic-gate.test.js",
              ".github/powertab-producer-gate.sh",
              ".github/powertab-structural-compare.py",
              ".github/workflows/powertab-pt2-v11-producer-gate-v2.yml",
              "docs/known-problems-register-addendum-powertab-source-evidence.md",
              "docs/powertab-pt2-v11-editor-evidence-gate-result-2026-08-05.md",
              "docs/powertab-pt2-v11-hosted-producer-execution-preflight-2026-08-05.md",
              "docs/powertab-pt2-v11-hosted-producer-run-1-failure-2026-08-05.md",
          }
          actual_files = set(
              filter(None, git("diff", "--name-only", f"{source_base}..HEAD").splitlines())
          )
          assert actual_files == expected_files, (
              "changed-file boundary mismatch\n"
              f"expected: {sorted(expected_files)}\n"
              f"actual:   {sorted(actual_files)}"
          )

          fixture = pathlib.Path(os.environ["FIXTURE_PATH"])
          fixture_hash = hashlib.sha256(fixture.read_bytes()).hexdigest()
          assert fixture_hash == os.environ["FIXTURE_SHA256"], (
              f"fixture hash mismatch: expected {os.environ['FIXTURE_SHA256']}, actual {fixture_hash}"
          )

          trigger = pathlib.Path(".github/powertab-editor-evidence-trigger")
          expected_trigger = "PowerTab v11 producer gate: corrected intentional run 2 on 2026-08-05.\n"
          actual_trigger = trigger.read_text(encoding="utf-8")
          assert actual_trigger == expected_trigger, (
              f"trigger content mismatch: expected {expected_trigger!r}, actual {actual_trigger!r}"
          )

          remote_main = git("ls-remote", "origin", "refs/heads/main").split()[0]
          assert remote_main == os.environ["FORK_MAIN_AUTHORITY"], (
              f"fork main mismatch: expected {os.environ['FORK_MAIN_AUTHORITY']}, actual {remote_main}"
          )

          print(f"branch: {actual_branch}")
          print(f"head: {git('rev-parse', 'HEAD')}")
          print(f"source base: {source_base}")
          print(f"accepted application ancestor: {accepted}")
          print(f"fork main: {remote_main}")
          print(f"fixture SHA-256: {fixture_hash}")
          print("changed files:")
          for path in sorted(actual_files):
              print(f"- {path}")
          PY
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Install corrected bounded producer runtime
        id: runtime
        if: steps.authority.outputs.exit_code == '0'
        shell: bash
        run: |
          set +e
          {
            sudo apt-get update
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
              imagemagick \
              innoextract \
              wine \
              wine64 \
              x11-utils \
              xauth \
              xdotool \
              xvfb
          } > "$EVIDENCE_DIR/runtime-install.log" 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          {
            printf 'PATH=%s\n' "$PATH"
            command -v wine || true
            command -v wine64 || true
            command -v wineboot || true
            command -v winepath || true
            command -v wineserver || true
            test -x /usr/lib/wine/wine64 && printf '%s\n' /usr/lib/wine/wine64 || true
            command -v innoextract || true
            command -v xvfb-run || true
            command -v xdotool || true
            dpkg-query -W -f='${Package} ${Version}\n' wine wine64 innoextract xvfb xdotool imagemagick 2>/dev/null || true
          } > "$EVIDENCE_DIR/runtime-versions.txt"
          exit 0

      - name: Execute corrected producer round trip
        id: producer
        if: steps.authority.outputs.exit_code == '0' && steps.runtime.outputs.exit_code == '0'
        shell: bash
        run: |
          chmod +x .github/powertab-producer-gate.sh
          set +e
          .github/powertab-producer-gate.sh > "$EVIDENCE_DIR/producer-shell.log" 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" != "0" ]; then
            printf 'producer-round-trip-failed exit_code=%s\n' "$code" > "$EVIDENCE_DIR/producer-status.txt"
          fi
          exit 0

      - name: Install locked project dependencies
        id: install
        if: steps.authority.outputs.exit_code == '0' && steps.runtime.outputs.exit_code == '0' && steps.producer.outputs.exit_code == '0'
        shell: bash
        run: |
          set +e
          npm ci --no-audit --no-fund > "$EVIDENCE_DIR/npm-install.log" 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Prove semantic parity from editor-resaved file
        id: semantic
        if: steps.authority.outputs.exit_code == '0' && steps.runtime.outputs.exit_code == '0' && steps.producer.outputs.exit_code == '0' && steps.install.outputs.exit_code == '0'
        shell: bash
        run: |
          cp .github/powertab-editor-semantic-gate.test.js src/__powertab_editor_gate.test.js
          set +e
          POWERTAB_EDITOR_EVIDENCE_FILE="$EDITOR_FILE" CI=true \
            npm test -- --watchAll=false --runInBand \
            --runTestsByPath src/__powertab_editor_gate.test.js \
            > "$EVIDENCE_DIR/editor-semantic-test.log" 2>&1
          code=$?
          rm -f src/__powertab_editor_gate.test.js
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Run complete inherited suite
        id: tests
        if: steps.authority.outputs.exit_code == '0' && steps.runtime.outputs.exit_code == '0' && steps.producer.outputs.exit_code == '0' && steps.install.outputs.exit_code == '0' && steps.semantic.outputs.exit_code == '0'
        shell: bash
        run: |
          set +e
          CI=true npm test -- --watchAll=false --runInBand > "$EVIDENCE_DIR/full-test.log" 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Build optimized application
        id: build
        if: steps.authority.outputs.exit_code == '0' && steps.runtime.outputs.exit_code == '0' && steps.producer.outputs.exit_code == '0' && steps.install.outputs.exit_code == '0' && steps.semantic.outputs.exit_code == '0' && steps.tests.outputs.exit_code == '0'
        shell: bash
        run: |
          set +e
          npm run build > "$EVIDENCE_DIR/production-build.log" 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Inspect build and asset boundary
        id: assets
        if: steps.authority.outputs.exit_code == '0' && steps.runtime.outputs.exit_code == '0' && steps.producer.outputs.exit_code == '0' && steps.install.outputs.exit_code == '0' && steps.semantic.outputs.exit_code == '0' && steps.tests.outputs.exit_code == '0' && steps.build.outputs.exit_code == '0'
        shell: bash
        run: |
          set +e
          python3 - <<'PY' > "$EVIDENCE_DIR/build-asset-inspection.txt" 2>&1
          import hashlib
          import pathlib

          build = pathlib.Path("build")
          assert build.is_dir(), "build directory is absent"
          forbidden_suffixes = {".dll", ".exe", ".sf2", ".sf3", ".wav", ".mp3"}
          forbidden_names = []
          files = []
          for path in sorted(p for p in build.rglob("*") if p.is_file()):
              relative = path.relative_to(build).as_posix()
              data = path.read_bytes()
              files.append((relative, len(data), hashlib.sha256(data).hexdigest()))
              lower = relative.lower()
              if path.suffix.lower() in forbidden_suffixes or "powertabeditor" in lower:
                  forbidden_names.append(relative)
          assert not forbidden_names, f"forbidden built assets: {forbidden_names}"
          print(f"file count: {len(files)}")
          print(f"total bytes: {sum(size for _, size, _ in files)}")
          print("built files:")
          for relative, size, digest in files:
              print(f"{digest}  {size:>10}  {relative}")
          PY
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Write corrected checkpoint summary
        if: always()
        shell: bash
        run: |
          cat > "$EVIDENCE_DIR/checkpoint-summary.txt" <<SUMMARY
          triggering_commit=$GITHUB_SHA
          authority_exit=${{ steps.authority.outputs.exit_code }}
          runtime_exit=${{ steps.runtime.outputs.exit_code }}
          producer_exit=${{ steps.producer.outputs.exit_code }}
          npm_install_exit=${{ steps.install.outputs.exit_code }}
          semantic_exit=${{ steps.semantic.outputs.exit_code }}
          full_tests_exit=${{ steps.tests.outputs.exit_code }}
          build_exit=${{ steps.build.outputs.exit_code }}
          assets_exit=${{ steps.assets.outputs.exit_code }}
          SUMMARY

      - name: Upload corrected bounded evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: powertab-v11-producer-evidence-corrected-${{ github.run_id }}
          path: ${{ env.EVIDENCE_DIR }}
          if-no-files-found: error
          retention-days: 1
          compression-level: 6

      - name: Enforce corrected producer checkpoint
        if: always()
        shell: bash
        run: |
          test "${{ steps.authority.outputs.exit_code }}" = "0"
          test "${{ steps.runtime.outputs.exit_code }}" = "0"
          test "${{ steps.producer.outputs.exit_code }}" = "0"
          test "${{ steps.install.outputs.exit_code }}" = "0"
          test "${{ steps.semantic.outputs.exit_code }}" = "0"
          test "${{ steps.tests.outputs.exit_code }}" = "0"
          test "${{ steps.build.outputs.exit_code }}" = "0"
          test "${{ steps.assets.outputs.exit_code }}" = "0"
