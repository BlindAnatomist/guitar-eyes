name: Temporary tablature intake compiled check

on:
  push:
    branches:
      - work/tablature-intake-expansion

concurrency:
  group: temporary-tablature-intake-checkpoint
  cancel-in-progress: true

permissions:
  contents: read
  statuses: write

jobs:
  verify:
    name: Verify compiled ASCII intake source
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact intake source
        uses: actions/checkout@v4
        with:
          ref: 08f8ab16135570d0e53b829daa5c153a15751a45
          fetch-depth: 0
          persist-credentials: false

      - name: Confirm source ancestry
        run: |
          test "$(git rev-parse HEAD)" = "08f8ab16135570d0e53b829daa5c153a15751a45"
          git merge-base --is-ancestor 72159d25958fffd941c95351c6781cf579e1d622 HEAD

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install locked dependencies
        env:
          npm_config_cache: /tmp/guitar-eyes-intake-npm-cache
        run: npm ci --no-audit --no-fund

      - name: Build production application
        run: npm run build

      - name: Verify compiled intake contracts
        shell: bash
        run: |
          grep -R -F 'Tablature intake expansion checkpoint 1' build >/dev/null
          grep -R -F 'Previous position' build >/dev/null
          grep -R -F 'Read current position' build >/dev/null
          grep -R -F 'Next position' build >/dev/null
          grep -R -F 'seven-string guitar' build >/dev/null
          grep -R -F 'Guitar Eyes recognized ' build >/dev/null
          grep -R -F 'Semantic reading currently supports complete four-string bass and six-string guitar blocks' build >/dev/null
          grep -R -F 'Unsupported symbols did not create musical positions' build >/dev/null
          grep -R -F 'MusicXML tablature was recognized' build >/dev/null

      - name: Record success status
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body -sS \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "{\"state\":\"success\",\"context\":\"guitar-eyes/intake-compiled-check\",\"description\":\"Production build and compiled fragments passed\",\"target_url\":\"https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}"

      - name: Record failure status
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body -sS \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "{\"state\":\"failure\",\"context\":\"guitar-eyes/intake-compiled-check\",\"description\":\"Inspect the compiled-fragment check\",\"target_url\":\"https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}"
