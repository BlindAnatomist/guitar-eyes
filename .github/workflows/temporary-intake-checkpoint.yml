name: Temporary tablature intake checkpoint

on:
  push:
    branches:
      - work/tablature-intake-expansion

concurrency:
  group: temporary-tablature-intake-checkpoint
  cancel-in-progress: true

permissions:
  contents: read
  statuses: write

jobs:
  verify:
    name: Diagnose exact ASCII intake source
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact intake source
        uses: actions/checkout@v4
        with:
          ref: 6e1fb1622bcef7a2e8150056d39c6fdd25f275be
          fetch-depth: 0
          persist-credentials: false

      - name: Confirm source ancestry
        run: |
          test "$(git rev-parse HEAD)" = "6e1fb1622bcef7a2e8150056d39c6fdd25f275be"
          git merge-base --is-ancestor 72159d25958fffd941c95351c6781cf579e1d622 HEAD

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install locked dependencies
        env:
          npm_config_cache: /tmp/guitar-eyes-intake-npm-cache
        run: npm ci --no-audit --no-fund

      - name: Capture complete automated suite output
        id: tests
        env:
          CI: true
        shell: bash
        run: |
          set +e
          set -o pipefail
          npm test -- --watchAll=false --runInBand 2>&1 | tee /tmp/intake-tests.log
          test_exit=${PIPESTATUS[0]}
          echo "exit_code=$test_exit" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload diagnostic Jest log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: intake-test-log
          path: /tmp/intake-tests.log
          if-no-files-found: error
          retention-days: 1

      - name: Enforce test result and expected count
        run: |
          test "${{ steps.tests.outputs.exit_code }}" = "0"
          grep -Eq 'Test Suites:[[:space:]]+18 passed,[[:space:]]+18 total' /tmp/intake-tests.log
          grep -Eq 'Tests:[[:space:]]+101 passed,[[:space:]]+101 total' /tmp/intake-tests.log

      - name: Build production application
        run: npm run build

      - name: Verify compiled intake contracts
        shell: bash
        run: |
          grep -R -F 'Tablature intake expansion checkpoint 1' build >/dev/null
          grep -R -F 'Previous position' build >/dev/null
          grep -R -F 'Read current position' build >/dev/null
          grep -R -F 'Next position' build >/dev/null
          grep -R -F 'recognized 7-string ASCII tablature' build >/dev/null
          grep -R -F 'Unsupported symbols did not create musical positions' build >/dev/null
          grep -R -F 'MusicXML tablature was recognized' build >/dev/null

      - name: Record success status
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body -sS \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "{\"state\":\"success\",\"context\":\"guitar-eyes/intake-checkpoint\",\"description\":\"18 suites, 101 tests and build passed\",\"target_url\":\"https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}"

      - name: Record failure status
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body -sS \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "{\"state\":\"failure\",\"context\":\"guitar-eyes/intake-checkpoint\",\"description\":\"Diagnostic Jest log uploaded\",\"target_url\":\"https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}"
