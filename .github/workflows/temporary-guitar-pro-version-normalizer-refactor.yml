name: Temporary Guitar Pro version normalizer correction

on:
  push:
    branches:
      - work/tablature-intake-expansion

concurrency:
  group: temporary-guitar-pro-version-normalizer-refactor
  cancel-in-progress: true

permissions:
  contents: write
  statuses: write

jobs:
  patch:
    if: github.event.head_commit.message != 'Apply inspected Guitar Pro version normalizer [generated-version-refactor]'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/tablature-intake-expansion
          fetch-depth: 0

      - name: Require exact pre-refactor normalizer
        run: |
          test "$(git hash-object src/guitarProNormalizer.js)" = "4e3a67446e453500d5b96d8d20056090b8a6bcf1"
          test -z "$(git status --short)"

      - name: Apply measured source-identity correction
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/guitarProNormalizer.js')
          text = path.read_text(encoding='utf-8')

          old_import = 'import { GUITAR_PRO_LIMITS } from "./guitarProLimits";\n\n'
          assert text.count(old_import) == 1
          text = text.replace(
              old_import,
              old_import + 'const GUITAR_PRO_SOURCE_FORMAT = "guitar-pro-archive";\n\n',
              1,
          )

          replacements = [
              ('source: "guitar-pro-7",', 'source: GUITAR_PRO_SOURCE_FORMAT,', 1),
              ('sourceFormat: "guitar-pro-7",', 'sourceFormat: GUITAR_PRO_SOURCE_FORMAT,', 4),
              (
                  'source: { format: "guitar-pro-7", measureNumber, beatIndex, noteIndex },',
                  'source: { format: GUITAR_PRO_SOURCE_FORMAT, measureNumber, beatIndex, noteIndex },',
                  2,
              ),
          ]
          for old, new, expected in replacements:
              assert text.count(old) == expected, (old, text.count(old), expected)
              text = text.replace(old, new)

          marker = 'export function normalizeGuitarProIntermediate(\n'
          assert text.count(marker) == 1
          validator = '''function validateVersionEvidence(intermediate) {
            const evidence = intermediate.versionEvidence;
            if (
              !evidence ||
              evidence.schemaVersion !== 1 ||
              evidence.archiveFamily !== "GP7_PLUS_ZIP" ||
              evidence.rootVersion !== "7.0" ||
              evidence.sourceVersion !== intermediate.sourceVersion
            ) {
              throw new GuitarProImportError(
                "The Guitar Pro decoder returned missing or inconsistent archive-version evidence.",
                "INVALID_GUITAR_PRO_VERSION_EVIDENCE"
              );
            }

            const gpMajor = /^([0-9]+)(?:\\.|$)/.exec(evidence.gpVersion || "")?.[1] || null;
            const encodingMajor = /^GP([0-9]+)$/i.exec(evidence.encodingDescription || "")?.[1] || null;
            const sourceMajor = /^GP([0-9]+)$/i.exec(evidence.sourceVersion || "")?.[1] || null;
            if (!gpMajor || gpMajor !== encodingMajor || gpMajor !== sourceMajor) {
              throw new GuitarProImportError(
                "The Guitar Pro archive-version markers contradict one another.",
                "CONTRADICTORY_GUITAR_PRO_VERSION_EVIDENCE"
              );
            }
            if (evidence.sourceVersion !== "GP8") {
              throw new GuitarProImportError(
                `This checkpoint has direct project evidence for GP8 semantics inside the shared .gp archive only; the archive reports ${evidence.sourceVersion || "an unknown version"}.`,
                "UNTESTED_GUITAR_PRO_VERSION"
              );
            }

            return evidence;
          }

          '''
          text = text.replace(marker, validator + marker, 1)

          start_marker = '  if (intermediate.sourceVersion !== "GP7") {'
          end_marker = '\n\n  const { tracks } = countAndValidateResources(intermediate, limits);'
          assert text.count(start_marker) == 1
          assert text.count(end_marker) == 1
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          old_block = text[start:end]
          assert 'Checkpoint 3A has direct project evidence for Guitar Pro 7 only' in old_block
          assert '"UNTESTED_GUITAR_PRO_VERSION"' in old_block
          text = text[:start] + '  const versionEvidence = validateVersionEvidence(intermediate);' + text[end:]

          block_version = '    sourceVersion: intermediate.sourceVersion,\n    sourceTrackIndex:'
          document_version = '    sourceVersion: intermediate.sourceVersion,\n    title:'
          assert text.count(block_version) == 1
          assert text.count(document_version) == 1
          text = text.replace(
              block_version,
              '    sourceVersion: intermediate.sourceVersion,\n    versionEvidence,\n    sourceTrackIndex:',
              1,
          )
          text = text.replace(
              document_version,
              '    sourceVersion: intermediate.sourceVersion,\n    versionEvidence,\n    title:',
              1,
          )

          assert text.count('guitar-pro-7') == 0
          assert text.count('GUITAR_PRO_SOURCE_FORMAT') == 8
          assert text.count('    versionEvidence,') == 2
          assert text.count('function validateVersionEvidence(intermediate)') == 1
          path.write_text(text, encoding='utf-8')

      - name: Constrain generated change
        run: |
          git diff -- src/guitarProNormalizer.js
          test "$(git status --short | wc -l)" -eq 1
          test "$(git status --short | awk '{print $2}')" = "src/guitarProNormalizer.js"
          ! grep -F 'guitar-pro-7' src/guitarProNormalizer.js
          grep -F 'const GUITAR_PRO_SOURCE_FORMAT = "guitar-pro-archive";' src/guitarProNormalizer.js >/dev/null
          grep -F 'const versionEvidence = validateVersionEvidence(intermediate);' src/guitarProNormalizer.js >/dev/null

      - name: Commit exact normalizer correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/guitarProNormalizer.js
          git commit -m 'Apply inspected Guitar Pro version normalizer [generated-version-refactor]'
          git push origin HEAD:work/tablature-intake-expansion

      - name: Record success status
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "{\"state\":\"success\",\"context\":\"guitar-eyes/version-normalizer-refactor\",\"description\":\"Measured version-evidence normalizer correction committed\",\"target_url\":\"https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}"

      - name: Record failure status
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "{\"state\":\"failure\",\"context\":\"guitar-eyes/version-normalizer-refactor\",\"description\":\"Measured normalizer correction failed before commit\",\"target_url\":\"https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}"
