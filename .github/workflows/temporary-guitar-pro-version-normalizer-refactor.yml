name: Temporary Guitar Pro version refactor diagnostic

on:
  push:
    branches:
      - work/tablature-intake-expansion

concurrency:
  group: temporary-guitar-pro-version-normalizer-refactor
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/tablature-intake-expansion
          fetch-depth: 0

      - name: Simulate normalizer patch and record every guard
        shell: python
        run: |
          from pathlib import Path
          import json
          import traceback

          text = Path('src/guitarProNormalizer.js').read_text(encoding='utf-8')
          report = {
              'blob': __import__('subprocess').check_output(
                  ['git', 'hash-object', 'src/guitarProNormalizer.js'], text=True
              ).strip(),
              'counts': {},
              'stages': [],
          }

          def mark(name, value=None):
              report['stages'].append({'name': name, 'value': value})

          try:
              old_import = 'import { GUITAR_PRO_LIMITS } from "./guitarProLimits";\n\n'
              report['counts']['old_import'] = text.count(old_import)
              mark('old_import', report['counts']['old_import'])
              text = text.replace(
                  old_import,
                  old_import + 'const GUITAR_PRO_SOURCE_FORMAT = "guitar-pro-archive";\n\n',
                  1,
              )

              patterns = [
                  'source: "guitar-pro-7",',
                  'sourceFormat: "guitar-pro-7",',
                  'source: { format: "guitar-pro-7", measureNumber, beatIndex, noteIndex },',
              ]
              for pattern in patterns:
                  report['counts'][pattern] = text.count(pattern)
                  mark(pattern, report['counts'][pattern])

              text = text.replace(patterns[0], 'source: GUITAR_PRO_SOURCE_FORMAT,')
              text = text.replace(patterns[1], 'sourceFormat: GUITAR_PRO_SOURCE_FORMAT,')
              text = text.replace(
                  patterns[2],
                  'source: { format: GUITAR_PRO_SOURCE_FORMAT, measureNumber, beatIndex, noteIndex },',
              )

              marker = 'export function normalizeGuitarProIntermediate(\n'
              report['counts']['export_marker'] = text.count(marker)
              mark('export_marker', report['counts']['export_marker'])

              start_marker = '  if (intermediate.sourceVersion !== "GP7") {'
              end_marker = '\n\n  const { tracks } = countAndValidateResources(intermediate, limits);'
              report['counts']['start_marker'] = text.count(start_marker)
              report['counts']['end_marker'] = text.count(end_marker)
              mark('version_markers', [
                  report['counts']['start_marker'],
                  report['counts']['end_marker'],
              ])

              start = text.index(start_marker)
              end = text.index(end_marker, start)
              old_block = text[start:end]
              report['old_block'] = old_block
              text = text[:start] + '  const versionEvidence = validateVersionEvidence(intermediate);' + text[end:]

              block_version = '    sourceVersion: intermediate.sourceVersion,\n    sourceTrackIndex:'
              document_version = '    sourceVersion: intermediate.sourceVersion,\n    title:'
              report['counts']['block_version'] = text.count(block_version)
              report['counts']['document_version'] = text.count(document_version)
              mark('return_markers', [
                  report['counts']['block_version'],
                  report['counts']['document_version'],
              ])

              text = text.replace(
                  block_version,
                  '    sourceVersion: intermediate.sourceVersion,\n    versionEvidence,\n    sourceTrackIndex:',
                  1,
              )
              text = text.replace(
                  document_version,
                  '    sourceVersion: intermediate.sourceVersion,\n    versionEvidence,\n    title:',
                  1,
              )

              report['counts']['remaining_old_label'] = text.count('guitar-pro-7')
              report['counts']['source_constant_references_without_validator'] = text.count(
                  'GUITAR_PRO_SOURCE_FORMAT'
              )
              report['counts']['version_evidence_returns'] = text.count('    versionEvidence,')
              mark('simulation_complete')
          except Exception:
              report['exception'] = traceback.format_exc()

          Path('/tmp/version-refactor-diagnostic.json').write_text(
              json.dumps(report, indent=2, sort_keys=True),
              encoding='utf-8',
          )
          print(json.dumps(report, indent=2, sort_keys=True))

      - name: Upload diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: guitar-pro-version-refactor-diagnostic
          path: /tmp/version-refactor-diagnostic.json
          if-no-files-found: error
          retention-days: 1
