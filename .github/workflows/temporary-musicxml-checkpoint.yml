name: Temporary MusicXML intake checkpoint

on:
  push:
    branches:
      - work/tablature-intake-expansion

concurrency:
  group: temporary-musicxml-intake-checkpoint
  cancel-in-progress: true

permissions:
  contents: read
  statuses: write

jobs:
  verify:
    name: Verify corrected MusicXML intake source
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact MusicXML source
        uses: actions/checkout@v4
        with:
          ref: 715547a123b2a6e862a8020858df96cb34c63526
          fetch-depth: 0
          persist-credentials: false

      - name: Confirm source ancestry
        run: |
          test "$(git rev-parse HEAD)" = "715547a123b2a6e862a8020858df96cb34c63526"
          git merge-base --is-ancestor 08f8ab16135570d0e53b829daa5c153a15751a45 HEAD

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install locked dependencies
        env:
          npm_config_cache: /tmp/guitar-eyes-musicxml-npm-cache
        run: npm ci --no-audit --no-fund

      - name: Run complete automated suite once
        id: tests
        env:
          CI: true
        shell: bash
        run: |
          set +e
          set -o pipefail
          npm test -- --watchAll=false --runInBand 2>&1 | tee /tmp/musicxml-tests.log
          test_exit=${PIPESTATUS[0]}
          echo "exit_code=$test_exit" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload Jest log on failure
        if: steps.tests.outputs.exit_code != '0'
        uses: actions/upload-artifact@v4
        with:
          name: musicxml-test-log-corrected
          path: /tmp/musicxml-tests.log
          if-no-files-found: error
          retention-days: 1

      - name: Enforce test result and expected count
        run: |
          test "${{ steps.tests.outputs.exit_code }}" = "0"
          grep -Eq 'Test Suites:[[:space:]]+19 passed,[[:space:]]+19 total' /tmp/musicxml-tests.log
          grep -Eq 'Tests:[[:space:]]+115 passed,[[:space:]]+115 total' /tmp/musicxml-tests.log

      - name: Build production application
        run: npm run build

      - name: Verify compiled MusicXML contracts
        shell: bash
        run: |
          grep -R -F 'MusicXML intake checkpoint 2' build >/dev/null
          grep -R -F 'Imported MusicXML tablature' build >/dev/null
          grep -R -F 'Normalized MusicXML spatial layout' build >/dev/null
          grep -R -F 'No MusicXML part contains explicit tablature string and fret data' build >/dev/null
          grep -R -F 'Compressed MusicXML was recognized' build >/dev/null
          grep -R -F 'Previous position' build >/dev/null
          grep -R -F 'Read current position' build >/dev/null
          grep -R -F 'Next position' build >/dev/null
          grep -R -F 'Rest.' build >/dev/null

      - name: Record success status
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body -sS \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "{\"state\":\"success\",\"context\":\"guitar-eyes/musicxml-checkpoint\",\"description\":\"19 suites, 115 tests and build passed\",\"target_url\":\"https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}"

      - name: Record failure status
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body -sS \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "{\"state\":\"failure\",\"context\":\"guitar-eyes/musicxml-checkpoint\",\"description\":\"Inspect the bounded MusicXML gate\",\"target_url\":\"https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}"
