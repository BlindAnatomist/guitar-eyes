name: Temporary MusicXML compiled diagnostic

on:
  push:
    branches:
      - work/tablature-intake-expansion

concurrency:
  group: temporary-musicxml-intake-checkpoint
  cancel-in-progress: true

permissions:
  contents: read
  statuses: write

jobs:
  verify:
    name: Diagnose compiled MusicXML source
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact MusicXML source
        uses: actions/checkout@v4
        with:
          ref: 715547a123b2a6e862a8020858df96cb34c63526
          fetch-depth: 0
          persist-credentials: false

      - name: Confirm source ancestry
        run: |
          test "$(git rev-parse HEAD)" = "715547a123b2a6e862a8020858df96cb34c63526"
          git merge-base --is-ancestor 08f8ab16135570d0e53b829daa5c153a15751a45 HEAD

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install locked dependencies
        env:
          npm_config_cache: /tmp/guitar-eyes-musicxml-npm-cache
        run: npm ci --no-audit --no-fund

      - name: Build production application
        run: npm run build

      - name: Diagnose compiled MusicXML contracts
        id: compiled
        shell: bash
        run: |
          report=/tmp/musicxml-compiled-report.txt
          : > "$report"
          failed=0
          while IFS= read -r phrase; do
            if grep -R -F "$phrase" build >/dev/null; then
              printf 'PASS: %s\n' "$phrase" | tee -a "$report"
            else
              printf 'FAIL: %s\n' "$phrase" | tee -a "$report"
              failed=1
            fi
          done <<'PHRASES'
          MusicXML intake checkpoint 2
          Imported MusicXML tablature
          Normalized MusicXML spatial layout
          No MusicXML part contains explicit tablature string and fret data
          Compressed MusicXML was recognized
          Previous position
          Read current position
          Next position
          Rest.
          PHRASES
          echo "failed=$failed" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload compiled diagnostic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: musicxml-compiled-report
          path: /tmp/musicxml-compiled-report.txt
          if-no-files-found: error
          retention-days: 1

      - name: Enforce compiled diagnostic
        run: test "${{ steps.compiled.outputs.failed }}" = "0"

      - name: Record success status
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body -sS \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "{\"state\":\"success\",\"context\":\"guitar-eyes/musicxml-compiled-diagnostic\",\"description\":\"Production build compiled phrases passed\",\"target_url\":\"https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}"

      - name: Record failure status
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body -sS \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "{\"state\":\"failure\",\"context\":\"guitar-eyes/musicxml-compiled-diagnostic\",\"description\":\"Compiled phrase report uploaded\",\"target_url\":\"https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}"
