name: Temporary MusicXML compiled check

on:
  push:
    branches:
      - work/tablature-intake-expansion

concurrency:
  group: temporary-musicxml-intake-checkpoint
  cancel-in-progress: true

permissions:
  contents: read
  statuses: write

jobs:
  verify:
    name: Verify compiled MusicXML source
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact MusicXML source
        uses: actions/checkout@v4
        with:
          ref: 715547a123b2a6e862a8020858df96cb34c63526
          fetch-depth: 0
          persist-credentials: false

      - name: Confirm source ancestry
        run: |
          test "$(git rev-parse HEAD)" = "715547a123b2a6e862a8020858df96cb34c63526"
          git merge-base --is-ancestor 08f8ab16135570d0e53b829daa5c153a15751a45 HEAD

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install locked dependencies
        env:
          npm_config_cache: /tmp/guitar-eyes-musicxml-npm-cache
        run: npm ci --no-audit --no-fund

      - name: Build production application
        run: npm run build

      - name: Verify compiled MusicXML contracts
        shell: bash
        run: |
          grep -R -F 'MusicXML intake checkpoint 2' build >/dev/null
          grep -R -F 'Imported ' build >/dev/null
          grep -R -F 'MusicXML tablature' build >/dev/null
          grep -R -F 'Loaded ' build >/dev/null
          grep -R -F 'Normalized MusicXML spatial layout' build >/dev/null
          grep -R -F 'No MusicXML part contains explicit tablature string and fret data' build >/dev/null
          grep -R -F 'Compressed MusicXML was recognized' build >/dev/null
          grep -R -F 'Previous position' build >/dev/null
          grep -R -F 'Read current position' build >/dev/null
          grep -R -F 'Next position' build >/dev/null
          grep -R -F 'Rest.' build >/dev/null

      - name: Record success status
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body -sS \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "{\"state\":\"success\",\"context\":\"guitar-eyes/musicxml-compiled-check\",\"description\":\"Production build compiled fragments passed\",\"target_url\":\"https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}"

      - name: Record failure status
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body -sS \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "{\"state\":\"failure\",\"context\":\"guitar-eyes/musicxml-compiled-check\",\"description\":\"Inspect the compiled-fragment check\",\"target_url\":\"https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}"
