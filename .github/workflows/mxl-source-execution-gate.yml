name: MXL audition convergence gate

on:
  push:
    branches:
      - work/mxl-execution-gate
    paths:
      - .github/workflows/mxl-source-execution-gate.yml

permissions:
  contents: read
  statuses: write

concurrency:
  group: mxl-audition-convergence-gate
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SOURCE_SHA: 724bf141b2bf45733b6c20446c6e2a7b3aa1d1a8
      STATUS_CONTEXT: guitar-eyes/mxl-audition-convergence-gate
    steps:
      - name: Mark gate pending
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'pending',
              context: process.env.STATUS_CONTEXT,
              description: 'Running exact MXL and audition convergence gate',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

      - name: Check out exact convergence source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact source and accepted audition ancestry
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git merge-base --is-ancestor 165e2ed5792811ebac9bf0488be93810bfa6246c HEAD
          test -z "$(git status --short)"
          mkdir -p /tmp/mxl-convergence-evidence
          {
            echo "source_sha=$(git rev-parse HEAD)"
            echo "trigger_sha=${GITHUB_SHA}"
            echo "accepted_audition_ancestor=165e2ed5792811ebac9bf0488be93810bfa6246c"
            echo "runner=${RUNNER_OS}"
          } > /tmp/mxl-convergence-evidence/summary.txt

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install locked dependencies
        shell: bash
        run: |
          set -o pipefail
          node --version | tee /tmp/mxl-convergence-evidence/node-version.txt
          npm --version | tee /tmp/mxl-convergence-evidence/npm-version.txt
          npm ci --no-audit --no-fund 2>&1 | tee /tmp/mxl-convergence-evidence/npm-ci.log

      - name: Run complete inherited and convergence test suite
        shell: bash
        run: |
          set -o pipefail
          CI=true npm test -- --watchAll=false --runInBand 2>&1 | tee /tmp/mxl-convergence-evidence/test.log

      - name: Build production application
        shell: bash
        run: |
          set -o pipefail
          CI=false npm run build 2>&1 | tee /tmp/mxl-convergence-evidence/build.log

      - name: Inspect compiled convergence artifact and repository cleanliness
        shell: bash
        run: |
          set -euo pipefail
          main_js="$(find build/static/js -maxdepth 1 -type f -name 'main.*.js' | head -n 1)"
          test -n "$main_js"
          test -f build/index.html
          grep -Fq '<title>Test build Guitar Eyes concise-control speech proof 1E</title>' build/index.html
          grep -Fq 'compressed MusicXML tablature' "$main_js"
          grep -Fq 'META-INF/container.xml' "$main_js"
          grep -Fq 'Previous position' "$main_js"
          grep -Fq 'Read current position' "$main_js"
          grep -Fq 'Next position' "$main_js"
          grep -Fq 'Audition current position' "$main_js"
          grep -Fq 'Position navigation' "$main_js"
          grep -Fq 'Position audio' "$main_js"
          grep -Fq 'Guitar Eyes compressed MusicXML audition convergence proof 1F' "$main_js"
          grep -Fq 'Current position is a rest. No pitched sound was played.' "$main_js"
          grep -Fq 'iPhone tablature reader' "$main_js"
          grep -Fq 'Desktop tablature reader' "$main_js"
          git diff --exit-code
          git diff --cached --exit-code
          {
            echo "main_js=$main_js"
            sha256sum build/index.html "$main_js"
            echo "compiled_mxl_contract=passed"
            echo "compiled_audition_contract=passed"
            echo "tracked_repository_clean=passed"
          } | tee /tmp/mxl-convergence-evidence/artifact-inspection.txt

      - name: Upload short-lived verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mxl-audition-convergence-gate-evidence
          path: /tmp/mxl-convergence-evidence
          if-no-files-found: error
          retention-days: 1

      - name: Publish final gate status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const state = '${{ job.status }}' === 'success'
              ? 'success'
              : ('${{ job.status }}' === 'failure' ? 'failure' : 'error');
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state,
              context: process.env.STATUS_CONTEXT,
              description: state === 'success'
                ? 'Exact MXL and audition convergence gate passed'
                : 'Exact MXL and audition convergence gate did not pass',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
