name: Temporary Guitar Pro track selection checkpoint

on:
  push:
    branches:
      - work/tablature-intake-expansion

concurrency:
  group: temporary-guitar-pro-track-selection-checkpoint
  cancel-in-progress: true

permissions:
  contents: write
  statuses: write

jobs:
  verify:
    if: github.event.head_commit.message != 'Complete Guitar Pro track selection proof 3C [generated-track-selection]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/tablature-intake-expansion
          fetch-depth: 0

      - name: Confirm checkpoint ancestry and clean checkout
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor fd3c1ee162d1be42bd45945227006521748284af HEAD
          test -z "$(git status --short)"

      - name: Prepare track selection checkpoint script
        run: python scripts/temporary_prepare_guitar_pro_track_selection_checkpoint.py

      - name: Apply track selection checkpoint
        id: edit
        shell: bash
        run: |
          set +e
          set -o pipefail
          python scripts/temporary_guitar_pro_track_selection_checkpoint.py 2>&1 | tee /tmp/track-selection-edit.log
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload edit diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: guitar-pro-track-selection-edit-diagnostics
          path: /tmp/track-selection-edit.log
          if-no-files-found: error
          retention-days: 1

      - name: Enforce edit result
        run: test "${{ steps.edit.outputs.exit_code }}" = "0"

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install exact dependencies and regenerate proof
        env:
          npm_config_cache: /tmp/guitar-eyes-track-selection-npm-cache
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm run generate:guitar-pro-archive-proof
          (cd fixtures/real-world && sha256sum -c guitar-pro-shared-archive-proof.gp.sha256)

      - name: Run complete test suite
        id: tests
        env:
          CI: true
        shell: bash
        run: |
          set +e
          set -o pipefail
          npm test -- --watchAll=false --runInBand 2>&1 | tee /tmp/track-selection-tests.log
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload test diagnostics on failure
        if: steps.tests.outputs.exit_code != '0'
        uses: actions/upload-artifact@v4
        with:
          name: guitar-pro-track-selection-test-diagnostics
          path: /tmp/track-selection-tests.log
          if-no-files-found: error
          retention-days: 1

      - name: Enforce test result
        run: test "${{ steps.tests.outputs.exit_code }}" = "0"

      - name: Build production application
        run: npm run build | tee /tmp/track-selection-build.log

      - name: Inspect selector bundle and lazy decoder boundary
        shell: python
        run: |
          from pathlib import Path
          import json

          build = Path('build')
          html = (build / 'index.html').read_text(encoding='utf-8')
          assert '<title>Test build Guitar Pro track selection proof 3C</title>' in html
          assert 'Test build: Guitar Pro track selection proof 3C.' in html

          js_files = sorted(build.rglob('*.js'))
          main_files = [path for path in js_files if path.name.startswith('main.')]
          assert len(main_files) == 1, main_files
          main = main_files[0]
          main_text = main.read_text(encoding='utf-8', errors='ignore')
          all_text = '\n'.join(
              path.read_text(encoding='utf-8', errors='ignore') for path in js_files
          )

          for phrase in [
              'Choose a Guitar Pro track',
              'Load selected track',
              'Other tracks not available',
              'track-selection-required',
              'guitar-eyes-guitar-pro-import',
          ]:
              assert phrase in all_text, phrase

          for forbidden in [
              'No score.gpif found in zip archive',
              'alphaSynth',
          ]:
              assert forbidden not in main_text, forbidden

          lazy_matches = []
          for path in js_files:
              if path == main:
                  continue
              text = path.read_text(encoding='utf-8', errors='ignore')
              if any(marker in text for marker in [
                  'No score.gpif found in zip archive',
                  'ScoreLoader',
                  'Guitar Pro 7-8',
              ]):
                  lazy_matches.append(path)
          assert lazy_matches, 'lazy alphaTab decoder chunk not found'

          forbidden_assets = []
          for path in build.rglob('*'):
              if not path.is_file():
                  continue
              lower = path.as_posix().lower()
              if any(token in lower for token in [
                  'bravura', 'soundfont', '.sf2', '.sf3', '.woff', '.woff2',
                  'alphatab.worker', 'alphatab.worklet', 'audio-worklet', 'synth.worker'
              ]):
                  forbidden_assets.append(path.as_posix())
          assert not forbidden_assets, forbidden_assets

          report = {
              'main': main.relative_to(build).as_posix(),
              'main_bytes': main.stat().st_size,
              'lazy_decoder_chunks': [path.relative_to(build).as_posix() for path in lazy_matches],
              'lazy_decoder_bytes': sum(path.stat().st_size for path in lazy_matches),
          }
          Path('/tmp/track-selection-build-report.json').write_text(
              json.dumps(report, indent=2, sort_keys=True),
              encoding='utf-8',
          )
          print(json.dumps(report, indent=2, sort_keys=True))

      - name: Upload successful verification report
        uses: actions/upload-artifact@v4
        with:
          name: guitar-pro-track-selection-verification
          path: |
            /tmp/track-selection-tests.log
            /tmp/track-selection-build.log
            /tmp/track-selection-build-report.json
          if-no-files-found: error
          retention-days: 1

      - name: Reject stale checkpoint identities and temporary debris
        run: |
          ! grep -RIn 'Checkpoint 3A' src docs/implementation-status.md
          grep -F 'Guitar Pro track selection proof 3C' src/App.js public/index.html docs/implementation-status.md >/dev/null
          grep -F 'INVALID_GUITAR_PRO_TRACK_SELECTION' src/guitarProNormalizer.js src/guitarProNormalizer.test.js >/dev/null
          grep -F 'requiresTrackSelection' src/guitarProReaderDocuments.js src/App.js >/dev/null
          grep -F 'track-selection' src/App.js >/dev/null
          grep -F 'Choose a Guitar Pro track' src/GuitarProTrackSelector.js >/dev/null

      - name: Commit verified checkpoint
        run: |
          rm -f scripts/temporary_guitar_pro_track_selection_checkpoint.py
          rm -f scripts/temporary_prepare_guitar_pro_track_selection_checkpoint.py
          rm -f .github/workflows/temporary-guitar-pro-track-selection-checkpoint.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m 'Complete Guitar Pro track selection proof 3C [generated-track-selection]'
          git push origin HEAD:work/tablature-intake-expansion

      - name: Record success status
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "{\"state\":\"success\",\"context\":\"guitar-eyes/track-selection-3c\",\"description\":\"Track inventory, selector, tests and build passed\",\"target_url\":\"https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}"

      - name: Record failure status
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "{\"state\":\"failure\",\"context\":\"guitar-eyes/track-selection-3c\",\"description\":\"Inspect bounded track-selection checkpoint failure\",\"target_url\":\"https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}"
