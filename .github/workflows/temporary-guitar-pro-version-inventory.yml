name: Temporary Guitar Pro version identity inventory

on:
  push:
    branches:
      - work/tablature-intake-expansion

concurrency:
  group: temporary-guitar-pro-version-identity-inventory
  cancel-in-progress: true

permissions:
  contents: read
  statuses: write

jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/tablature-intake-expansion
          fetch-depth: 0

      - name: Record remaining GP7 identity references
        shell: bash
        run: |
          set +e
          grep -RInE 'GP7|gp7|Guitar Pro 7|guitar-pro-7' \
            src public scripts fixtures docs package.json README.md THIRD_PARTY_NOTICES.md \
            --exclude='*.gp' \
            --exclude='*.sha256' \
            > /tmp/guitar-pro-version-identity-inventory.txt
          grep_exit=$?
          if [ "$grep_exit" -ne 0 ] && [ "$grep_exit" -ne 1 ]; then
            exit "$grep_exit"
          fi
          cat /tmp/guitar-pro-version-identity-inventory.txt

      - name: Upload inventory
        uses: actions/upload-artifact@v4
        with:
          name: guitar-pro-version-identity-inventory
          path: /tmp/guitar-pro-version-identity-inventory.txt
          if-no-files-found: error
          retention-days: 1

      - name: Record inventory status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "{\"state\":\"success\",\"context\":\"guitar-eyes/version-identity-inventory\",\"description\":\"Read-only GP7 identity inventory available\",\"target_url\":\"https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}"
