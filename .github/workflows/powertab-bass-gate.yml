name: PowerTab bass corrective gate

on:
  push:
    branches:
      - work/powertab-standard-bass-profile-corrective-gate

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@v4
        with:
          ref: 487b5c26c690ff663ae9f9739e7557dec1dbc143
          fetch-depth: 0

      - name: Prove ancestry
        run: |
          test "$(git rev-parse HEAD)" = "487b5c26c690ff663ae9f9739e7557dec1dbc143"
          git merge-base --is-ancestor 02f130f3c871de39d4c48c45d8c09f35980fba45 HEAD
          git merge-base --is-ancestor 15d70f6b0b3e786838260e96ba2d343af9fb792a HEAD

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate exact bass evidence
        run: |
          mkdir -p "$RUNNER_TEMP/bass-a" "$RUNNER_TEMP/bass-b"
          node scripts/generate-powertab-standard-bass-proofs.mjs "$RUNNER_TEMP/bass-a"
          node scripts/generate-powertab-standard-bass-proofs.mjs "$RUNNER_TEMP/bass-b"
          diff -qr "$RUNNER_TEMP/bass-a" "$RUNNER_TEMP/bass-b"
          cmp "$RUNNER_TEMP/bass-a/manifest.json" fixtures/powertab-standard-bass/manifest.expected.json
          echo "POWERTAB_BASS_GENERATED_DIR=$RUNNER_TEMP/bass-a" >> "$GITHUB_ENV"

      - name: Run focused tests
        run: CI=true npm test -- --watchAll=false --runTestsByPath src/powerTabStandardBassLegacyGenerated.test.js src/powerTabSourceNormalizer.test.js src/powerTabTrackInventory.test.js src/powerTabLegacyDecoder.test.js src/powerTabLegacyHistoricalDecoder.test.js src/powerTabLegacyV17Decoder.test.js

      - name: Run complete suite
        run: CI=true npm test -- --watchAll=false

      - name: Build production application
        run: npm run build
